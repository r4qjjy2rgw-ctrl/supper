/* ---------------------------------------------------------
   Grocery aggregation
--------------------------------------------------------- */
function isStaple(itemName){
  var stap = Store.list('staples').find(function(s){ return normalize(s.name) === normalize(itemName); });
  return stap && stap.autoExclude !== false;
}

// Covers both kinds of weekly picks: dated (Day view) and unscheduled
// (Recipe view — recipeId set, date null, tagged with weekStart instead).
function weekPoolEntries(weekStartISO){
  var start = weekStartISO;
  var end = fmtDate(addDays(new Date(weekStartISO+'T00:00:00'), 6));
  return Store.list('planEntries').filter(function(p){
    if (p.date) return p.date >= start && p.date <= end;
    return p.weekStart === weekStartISO;
  });
}
function findWeekEntryForRecipe(weekStartISO, recipeId){
  return weekPoolEntries(weekStartISO).find(function(p){ return p.recipeId === recipeId; });
}
function toggleWeekPick(weekStartISO, recipeId){
  var existing = findWeekEntryForRecipe(weekStartISO, recipeId);
  if (existing) Store.softDelete('planEntries', existing.id);
  else Store.put('planEntries', { recipeId: recipeId, date: null, weekStart: weekStartISO, mealType: 'dinner' });
  render();
}
// Move an already-picked-but-unscheduled recipe onto a specific day,
// replacing whatever (if anything) was already on that day.
function scheduleWeekPick(dateISO, existingDayEntry, poolEntry){
  if (existingDayEntry && existingDayEntry.id !== poolEntry.id){
    Store.softDelete('planEntries', existingDayEntry.id);
  }
  poolEntry.date = dateISO;
  Store.put('planEntries', poolEntry);
  closeSheet();
  render();
  toast('Scheduled for ' + DOW_FULL[new Date(dateISO+'T00:00:00').getDay()]);
}

function computeAutoGroceryItems(weekStartISO){
  var entries = weekPoolEntries(weekStartISO);
  var map = {};
  entries.forEach(function(entry){
    if (!entry.recipeId) return;
    var recipe = Store.get().recipes[entry.recipeId];
    if (!recipe || recipe.deleted) return;
    var base = recipe.servingsBase || 4;
    var target = entry.servingsOverride || base;
    var scale = target / base;
    (recipe.ingredients||[]).forEach(function(ing){
      if (!ing.item) return;
      if (isStaple(ing.item)) return;
      var key = normalize(ing.item) + '|' + normalize(ing.unit);
      var qty = (parseFloat(ing.qty)||0) * scale;
      if (!map[key]){
        map[key] = { name: ing.item, unit: ing.unit||'', qty: qty, category: ing.category||'Other', recipes: [recipe.name] };
      } else {
        map[key].qty += qty;
        if (map[key].recipes.indexOf(recipe.name) === -1) map[key].recipes.push(recipe.name);
      }
    });
  });
  return Object.keys(map).map(function(k){ return map[k]; });
}

function getWeekChecks(weekStartISO){
  var d = Store.get();
  if (!d.weekChecks[weekStartISO]) d.weekChecks[weekStartISO] = {};
  return d.weekChecks[weekStartISO];
}
function toggleAutoCheck(weekStartISO, key){
  var wc = getWeekChecks(weekStartISO);
  wc[key] = !wc[key];
  Store.persist();
}

/* ---------------------------------------------------------

--------------------------------------------------------- */
var State = {
  tab: 'week',
  weekStart: fmtDate(startOfWeek(new Date())),
  weekViewMode: 'day', // synced from saved settings once Store loads, see boot sequence below
  recipeSearch: '',
  recipeFilterTag: null,
  cookRecipeId: null,
  cookStep: 0,
  wakeLock: null
};

function switchTab(tab){
  State.tab = tab;
  $all('.tabbar button').forEach(function(b){ b.classList.toggle('active', b.dataset.tab === tab); });
  $all('.screen').forEach(function(s){ s.classList.remove('active'); });
  $('#screen-'+tab).classList.add('active');
  renderTopbar();
  render();
}

function renderTopbar(){
  var titles = { week:'This Week', grocery:'Grocery List', recipes:'Recipes', settings:'Settings' };
  $('#screenTitle').textContent = titles[State.tab];
  var subs = {
    week: '',
    grocery: '',
    recipes: Store.list('recipes').length + ' saved',
    settings: ''
  };
  $('#screenSub').textContent = subs[State.tab] || '';

  var actions = $('#topbarActions');
  actions.innerHTML = '';
  if (State.tab === 'recipes'){
    actions.appendChild(el('button', { class:'btn btn-primary', style:'padding:9px 16px;font-size:14px;', onclick: function(){ openRecipeEditor(null); } }, ['+ Add']));
  }
}

/* ---------------------------------------------------------
   Render: This Week
--------------------------------------------------------- */
function renderWeek(){
  var root = $('#screen-week');
  root.innerHTML = '';
  var start = new Date(State.weekStart+'T00:00:00');
  var end = addDays(start, 6);
  var fmtShort = function(d){ return (d.getMonth()+1)+'/'+d.getDate(); };

  var nav = el('div', {class:'week-nav card', style:'padding:10px 12px;margin-bottom:14px;'}, [
    el('button', { onclick: function(){ State.weekStart = fmtDate(addDays(start,-7)); render(); } }, ['‹']),
    el('div', {class:'range'}, [fmtShort(start) + ' – ' + fmtShort(end)]),
    el('button', { onclick: function(){ State.weekStart = fmtDate(addDays(start,7)); render(); } }, ['›'])
  ]);
  root.appendChild(nav);

  var mode = State.weekViewMode;
  var toggle = el('div', {class:'view-toggle'}, [
    el('button', { class:'seg'+(mode==='day'?' active':''), onclick:function(){ setWeekViewMode('day'); } }, ['Day view']),
    el('button', { class:'seg'+(mode==='recipe'?' active':''), onclick:function(){ setWeekViewMode('recipe'); } }, ['Recipe view'])
  ]);
  root.appendChild(toggle);

  if (mode === 'day'){
    renderWeekGlance(root, start);
    renderDayList(root, start);
    var unscheduled = weekPoolEntries(State.weekStart).filter(function(p){ return p.recipeId && !p.date; });
    if (unscheduled.length){
      root.appendChild(el('div', {class:'section-title'}, ['Still need a night (' + unscheduled.length + ')']));
      root.appendChild(buildShelf(unscheduled, State.weekStart, false));
    }
  } else {
    var pool = weekPoolEntries(State.weekStart).filter(function(p){ return p.recipeId; });
    root.appendChild(el('div', {class:'section-title'}, [
      "This week's dinners",
      el('span', {style:'font-weight:600;color:var(--ink-soft);'}, [pool.length + (pool.length===1?' pick':' picks')])
    ]));
    root.appendChild(buildShelf(pool, State.weekStart, true));
    if (pool.length){
      root.appendChild(el('p', {style:'font-size:12.5px;color:var(--ink-soft);margin:2px 4px 0;'}, ['Switch to Day view to pin any of these to a specific night — or just shop for the week and decide as you go.']));
    }
  }
}

function setWeekViewMode(mode){
  State.weekViewMode = mode;
  Store.saveSettings({ weekViewMode: mode });
  render();
}

function renderWeekGlance(root, start){
  var strip = el('div', {class:'week-glance'});
  for (var i=0;i<7;i++){
    var day = addDays(start, i);
    var iso = fmtDate(day);
    var entry = Store.list('planEntries').find(function(p){ return p.date === iso; });
    var pill = el('div', {class:'glance-pill'}, [DOW[day.getDay()][0]]);
    if (entry && entry.recipeId){
      var recipe = Store.get().recipes[entry.recipeId];
      var color = tagColor(recipe && recipe.tags && recipe.tags[0]) || 'var(--herb)';
      pill.classList.add('filled');
      pill.style.background = color;
      pill.style.borderColor = color;
    } else if (entry && entry.label){
      pill.classList.add('filled');
      pill.style.background = 'var(--ink-soft)';
      pill.style.borderColor = 'var(--ink-soft)';
    }
    strip.appendChild(pill);
  }
  root.appendChild(strip);
}

function renderDayList(root, start){
  var today = todayISO();
  for (var i=0;i<7;i++){
    var day = addDays(start, i);
    var iso = fmtDate(day);
    var entry = Store.list('planEntries').find(function(p){ return p.date === iso; });
    var row = el('div', { class: 'day-row card' + (iso===today?' is-today':'') });

    var borderColor = null;
    if (entry && entry.recipeId){
      var recipeForColor = Store.get().recipes[entry.recipeId];
      borderColor = tagColor(recipeForColor && recipeForColor.tags && recipeForColor.tags[0]) || 'var(--herb)';
    } else if (entry && entry.label){
      borderColor = 'var(--ink-soft)';
    }
    if (borderColor) row.style.borderLeft = '4px solid ' + borderColor;

    row.appendChild(el('div', {class:'date'}, [
      el('div', {class:'dow'}, [DOW[day.getDay()]]),
      el('div', {class:'num'}, [String(day.getDate())])
    ]));

    var slot;
    if (entry && entry.recipeId){
      var recipe = Store.get().recipes[entry.recipeId];
      slot = el('button', { class:'day-slot', onclick: function(entry){ return function(){ openDayPicker(iso, entry); }; }(entry) }, [
        el('span', {class:'meal-name'}, [recipe ? recipe.name : '(deleted recipe)']),
        el('span', {class:'meal-tag'}, [entry.servingsOverride ? entry.servingsOverride+' servings' : '']),
      ]);
    } else if (entry && entry.label){
      slot = el('button', { class:'day-slot', onclick: function(entry){ return function(){ openDayPicker(iso, entry); }; }(entry) }, [
        el('span', {class:'meal-name'}, [entry.label])
      ]);
    } else {
      slot = el('button', { class:'day-slot', onclick: function(iso){ return function(){ openDayPicker(iso, null); }; }(iso) }, [
        el('span', {class:'meal-empty'}, ['+ Add dinner'])
      ]);
    }
    row.appendChild(slot);
    if (entry){
      row.appendChild(el('button', { class:'clear-btn', onclick: function(entry){ return function(){ Store.softDelete('planEntries', entry.id); render(); }; }(entry) }, ['×']));
    }
    root.appendChild(row);
  }
}

// Shared shelf renderer used by both the Day view's "still need a night"
// strip and the full Recipe view. includeAddCard turns on the trailing
// "+ Add recipe" tile which opens the multi-pick sheet.
function buildShelf(pool, weekStartISO, includeAddCard){
  var shelf = el('div', {class:'week-shelf'});
  pool.forEach(function(entry){
    var recipe = Store.get().recipes[entry.recipeId];
    if (!recipe) return;
    var photoEl;
    if (recipe.photo){
      photoEl = el('img', {class:'sc-photo', src:recipe.photo});
    } else {
      var color = tagColor(recipe.tags && recipe.tags[0]) || 'var(--herb)';
      photoEl = el('div', {class:'sc-photo-placeholder', style:'background:'+color+';'}, [(recipe.name||'?').charAt(0).toUpperCase()]);
    }
    var card = el('div', { class:'shelf-card', onclick: function(){ openRecipeDetail(recipe.id); } }, [
      photoEl,
      el('div', {class:'sc-body'}, [
        el('span', {class:'sc-name'}, [recipe.name]),
        el('div', {class:'sc-meta'}, [entry.date ? DOW_FULL[new Date(entry.date+'T00:00:00').getDay()] : 'Not scheduled'])
      ]),
      el('button', {class:'sc-remove', onclick: function(e){ e.stopPropagation(); Store.softDelete('planEntries', entry.id); render(); }}, ['×'])
    ]);
    shelf.appendChild(card);
  });
  if (includeAddCard){
    shelf.appendChild(el('button', {class:'shelf-add', onclick: function(){ openWeekPicker(weekStartISO); }}, ['+ Add recipe']));
  }
  return shelf;
}

function openWeekPicker(weekStartISO){
  var body = el('div');
  var searchInput = el('input', {type:'search', placeholder:'Search recipes…'});
  body.appendChild(el('div', {class:'field'}, [searchInput]));
  var listWrap = el('ul', {class:'picker-list'});
  body.appendChild(listWrap);

  function renderList(q){
    listWrap.innerHTML = '';
    var recipes = Store.list('recipes').filter(function(r){
      return !q || normalize(r.name).indexOf(normalize(q)) !== -1;
    }).sort(function(a,b){ return a.name.localeCompare(b.name); });
    recipes.forEach(function(r){
      var existing = findWeekEntryForRecipe(weekStartISO, r.id);
      var li = el('li');
      li.appendChild(el('button', { class:'picker-item', onclick: function(){
        toggleWeekPick(weekStartISO, r.id);
        renderList(searchInput.value);
      }}, [
        el('span', {style:'display:flex;align-items:center;gap:10px;'}, [
          el('span', {class:'g-check'+(existing?' checked':''), style:'flex:none;'}, [existing?checkIcon():'']),
          el('span', {}, [r.name])
        ]),
        el('span', {class:'pt'}, [existing ? (existing.date ? 'scheduled' : 'picked') : ''])
      ]));
      listWrap.appendChild(li);
    });
  }
  renderList('');
  searchInput.addEventListener('input', function(){ renderList(searchInput.value); });
  openSheet("Pick this week's dinners", body, true);
}

function openDayPicker(dateISO, existingEntry){
  var body = el('div');

  var unscheduled = weekPoolEntries(State.weekStart).filter(function(p){ return p.recipeId && !p.date; });
  if (unscheduled.length){
    body.appendChild(el('div', {class:'section-title'}, ["This week's picks"]));
    var picksRow = el('div', {class:'chip-row'});
    unscheduled.forEach(function(p){
      var r = Store.get().recipes[p.recipeId];
      if (!r) return;
      picksRow.appendChild(el('button', {class:'chip', onclick: function(){ scheduleWeekPick(dateISO, existingEntry, p); }}, [r.name]));
    });
    body.appendChild(picksRow);
  }

  body.appendChild(el('div', {class:'quick-picks'}, [
    quickPickBtn('Leftovers', dateISO, existingEntry),
    quickPickBtn('Eating out', dateISO, existingEntry),
    quickPickBtn('TBD', dateISO, existingEntry)
  ]));
  var searchWrap = el('input', { type:'search', placeholder:'Search recipes…' });
  body.appendChild(el('div', {class:'field'}, [searchWrap]));
  var listWrap = el('ul', {class:'picker-list'});
  body.appendChild(listWrap);

  function renderList(q){
    listWrap.innerHTML = '';
    var recipes = Store.list('recipes').filter(function(r){
      return !q || normalize(r.name).indexOf(normalize(q)) !== -1;
    }).sort(function(a,b){ return a.name.localeCompare(b.name); });
    if (recipes.length === 0){
      listWrap.appendChild(el('div', {style:'padding:20px 4px;color:var(--ink-soft);font-size:14px;'}, ['No recipes match.']));
    }
    recipes.forEach(function(r){
      var li = el('li');
      var btn = el('button', { class:'picker-item', onclick: function(){
        assignRecipeToDay(dateISO, existingEntry, r.id);
      }}, [
        el('span', {}, [r.name]),
        el('span', {class:'pt'}, [r.needsDetails ? 'needs details' : ''])
      ]);
      li.appendChild(btn);
      listWrap.appendChild(li);
    });
  }
  renderList('');
  searchWrap.addEventListener('input', function(){ renderList(searchWrap.value); });

  openSheet(DOW_FULL[new Date(dateISO+'T00:00:00').getDay()], body, true);
}
function quickPickBtn(label, dateISO, existingEntry){
  return el('button', { class:'chip', onclick: function(){ assignLabelToDay(dateISO, existingEntry, label); } }, [label]);
}
function assignRecipeToDay(dateISO, existingEntry, recipeId){
  // Reuse an existing pick for this recipe this week (scheduled or not)
  // rather than creating a duplicate entry for the same dinner.
  var existingForRecipe = findWeekEntryForRecipe(State.weekStart, recipeId);
  var rec;
  if (existingForRecipe && (!existingEntry || existingForRecipe.id !== existingEntry.id)){
    if (existingEntry) Store.softDelete('planEntries', existingEntry.id);
    rec = existingForRecipe;
  } else {
    rec = existingEntry || { date: dateISO, mealType: 'dinner' };
  }
  rec.date = dateISO;
  rec.recipeId = recipeId;
  delete rec.label;
  delete rec.weekStart;
  Store.put('planEntries', rec);
  closeSheet();
  render();
  toast('Added to ' + DOW[new Date(dateISO+'T00:00:00').getDay()]);
}
function assignLabelToDay(dateISO, existingEntry, label){
  var rec = existingEntry || { date: dateISO, mealType: 'dinner' };
  rec.label = label;
  delete rec.recipeId;
  Store.put('planEntries', rec);
  closeSheet();
  render();
}

/* ---------------------------------------------------------
   Render: Recipes
--------------------------------------------------------- */
function renderRecipes(){
  var root = $('#screen-recipes');
  root.innerHTML = '';

  var searchRow = el('div', {class:'recipe-search'}, [
    el('input', { type:'search', placeholder:'Search recipes…', value: State.recipeSearch,
      oninput: function(e){ State.recipeSearch = e.target.value; renderRecipeList(); } })
  ]);
  root.appendChild(searchRow);

  var chips = el('div', {class:'chip-row'});
  chips.appendChild(el('button', { class:'chip' + (State.recipeFilterTag===null?' active':''), onclick: function(){ State.recipeFilterTag=null; renderRecipeList(); } }, ['All']));
  chips.appendChild(el('button', { class:'chip' + (State.recipeFilterTag==='favorite'?' active':''), onclick: function(){ State.recipeFilterTag='favorite'; renderRecipeList(); } }, ['★ Favorites']));
  chips.appendChild(el('button', { class:'chip' + (State.recipeFilterTag==='needsDetails'?' active':''), onclick: function(){ State.recipeFilterTag='needsDetails'; renderRecipeList(); } }, ['Needs details']));
  MEAL_TAGS.forEach(function(tag){
    chips.appendChild(el('button', { class:'chip' + (State.recipeFilterTag===tag?' active':''), onclick: function(){ State.recipeFilterTag=tag; renderRecipeList(); } }, [tag]));
  });
  root.appendChild(chips);

  var grid = el('div', { class:'recipe-grid', id:'recipeGrid' });
  root.appendChild(grid);
  renderRecipeList();
}

function renderRecipeList(){
  var grid = $('#recipeGrid');
  if (!grid) return;
  grid.innerHTML = '';
  var recipes = Store.list('recipes').filter(function(r){
    if (State.recipeSearch && normalize(r.name).indexOf(normalize(State.recipeSearch)) === -1) return false;
    if (State.recipeFilterTag === 'favorite') return !!r.favorite;
    if (State.recipeFilterTag === 'needsDetails') return !!r.needsDetails;
    if (State.recipeFilterTag) return (r.tags||[]).indexOf(State.recipeFilterTag) !== -1;
    return true;
  }).sort(function(a,b){ return a.name.localeCompare(b.name); });

  if (recipes.length === 0){
    grid.style.display = 'block';
    grid.appendChild(el('div', {class:'empty-state'}, [
      el('h3', {}, ['No recipes here yet']),
      el('p', {}, ['Add the ones Shannon actually makes — everything else can wait.']),
      el('button', {class:'btn btn-primary', onclick:function(){ openRecipeEditor(null); }}, ['+ Add a recipe'])
    ]));
    return;
  }
  grid.style.display = 'grid';
  recipes.forEach(function(r){
    var photoEl;
    if (r.photo){
      photoEl = el('img', {class:'rt-photo', src:r.photo});
    } else {
      var color = tagColor(r.tags && r.tags[0]) || 'var(--herb)';
      photoEl = el('div', {class:'rt-photo-placeholder', style:'background:'+color+';'}, [(r.name||'?').charAt(0).toUpperCase()]);
    }
    var tile = el('button', { class:'recipe-tile card', onclick: function(){ openRecipeDetail(r.id); } }, [
      photoEl,
      el('div', {class:'rt-body'}, [
        el('div', {class:'rt-name'}, [r.name]),
        el('div', {class:'rt-meta'}, [
          el('span', {}, [(r.ingredients||[]).length ? (r.ingredients.length+' ing') : (r.needsDetails ? 'needs details' : '')]),
          r.favorite ? el('span', {class:'star'}, ['★']) : el('span',{},[])
        ])
      ])
    ]);
    grid.appendChild(tile);
  });
}

function openRecipeDetail(id){
  var r = Store.get().recipes[id];
  if (!r) return;
  var servings = r.servingsBase || 4;

  var body = el('div');
  if (r.photo){
    body.appendChild(el('img', {class:'detail-photo', src: r.photo}));
  }
  var meta = el('div', {class:'detail-meta'});
  if (r.prepMin) meta.appendChild(el('span',{},['Prep ' + r.prepMin + 'm']));
  if (r.cookMin) meta.appendChild(el('span',{},['Cook ' + r.cookMin + 'm']));
  (r.tags||[]).forEach(function(t){ meta.appendChild(el('span',{},[t])); });
  body.appendChild(meta);

  if (r.needsDetails){
    body.appendChild(el('div', {style:'background:var(--card);border:1px dashed var(--clay);border-radius:12px;padding:12px 14px;margin:14px 0;font-size:13.5px;color:var(--ink-soft);'}, [
      "Saved from Mealime — ingredients and steps haven't been added yet."
    ]));
  }

  var stepperNum = el('span', {class:'n'}, [servings + ' servings']);
  var stepper = el('div', {class:'servings-stepper'}, [
    el('button', { onclick: function(){ if (servings>1){ servings--; stepperNum.textContent = servings+' servings'; renderIngList(); } } }, ['−']),
    stepperNum,
    el('button', { onclick: function(){ servings++; stepperNum.textContent = servings+' servings'; renderIngList(); } }, ['+'])
  ]);
  body.appendChild(stepper);

  var ingList = el('ul', {class:'ing-list'});
  body.appendChild(ingList);
  function renderIngList(){
    ingList.innerHTML = '';
    var scale = servings / (r.servingsBase||4);
    if ((r.ingredients||[]).length === 0){
      ingList.appendChild(el('li',{},[el('span',{style:'color:var(--ink-soft);'},['No ingredients added yet'])]));
      return;
    }
    r.ingredients.forEach(function(ing){
      var q = fmtQty((parseFloat(ing.qty)||0) * scale);
      ingList.appendChild(el('li', {}, [
        el('span', {}, [ing.item]),
        el('span', {class:'amt'}, [[q, ing.unit].filter(Boolean).join(' ')])
      ]));
    });
  }
  renderIngList();

  if ((r.steps||[]).length){
    body.appendChild(el('div', {class:'section-title'}, ['Steps']));
    var stepsList = el('ul', {class:'steps-list'});
    r.steps.forEach(function(s){ stepsList.appendChild(el('li', {}, [s])); });
    body.appendChild(stepsList);
  }

  if (r.notes){
    body.appendChild(el('div', {class:'section-title'}, ['Notes']));
    body.appendChild(el('p', {style:'font-size:14px;color:var(--ink-soft);line-height:1.5;'}, [r.notes]));
  }

  var actions = el('div', {class:'detail-actions'});
  actions.appendChild(el('button', {class:'btn btn-primary', onclick: function(){
    closeSheet();
    setTimeout(function(){ openAddToPlanFromRecipe(r.id, servings); }, 180);
  }}, ['Add to plan']));
  if ((r.steps||[]).length){
    actions.appendChild(el('button', {class:'btn btn-ghost', onclick: function(){ closeSheet(); startCookMode(r.id); }}, ['Cook']));
  }
  body.appendChild(actions);

  var editRow = el('div', {style:'display:flex;gap:8px;margin-top:10px;'}, [
    el('button', {class:'btn btn-ghost', style:'flex:1;', onclick: function(){ closeSheet(); setTimeout(function(){ openRecipeEditor(r.id); },180); }}, ['Edit']),
    el('button', {class:'btn btn-danger', onclick: function(){
      if (confirm('Delete "'+r.name+'"?')){ Store.softDelete('recipes', r.id); closeSheet(); render(); }
    }}, ['Delete']),
    el('button', {class:'btn btn-ghost', onclick: function(){
      r.favorite = !r.favorite; Store.put('recipes', r); closeSheet(); render();
    }}, [r.favorite ? '★ Unfavorite' : '☆ Favorite'])
  ]);
  body.appendChild(editRow);

  openSheet(r.name, body, false, true);
}

function openAddToPlanFromRecipe(recipeId, servings){
  var body = el('div');
  var start = new Date(State.weekStart+'T00:00:00');
  var list = el('ul', {class:'picker-list'});
  for (var i=0;i<7;i++){
    var day = addDays(start, i);
    var iso = fmtDate(day);
    (function(iso, day){
      list.appendChild(el('li', {}, [
        el('button', {class:'picker-item', onclick: function(){
          // If this recipe is already picked for the week (scheduled or not),
          // reschedule that same entry instead of creating a duplicate.
          var existingDay = Store.list('planEntries').find(function(p){ return p.date===iso; });
          var existingForRecipe = findWeekEntryForRecipe(State.weekStart, recipeId);
          var rec;
          if (existingForRecipe && (!existingDay || existingForRecipe.id !== existingDay.id)){
            if (existingDay) Store.softDelete('planEntries', existingDay.id);
            rec = existingForRecipe;
          } else {
            rec = existingDay || { date: iso, mealType:'dinner' };
          }
          rec.date = iso;
          rec.recipeId = recipeId;
          rec.servingsOverride = servings;
          delete rec.label;
          delete rec.weekStart;
          Store.put('planEntries', rec);
          closeSheet();
          switchTab('week');
          toast('Added to ' + DOW_FULL[day.getDay()]);
        }}, [DOW_FULL[day.getDay()] + ' ' + (day.getMonth()+1)+'/'+day.getDate()])
      ]));
    })(iso, day);
  }
  body.appendChild(list);
  openSheet('Add to which day?', body, true);
}

function openRecipeEditor(id){
  var existing = id ? Store.get().recipes[id] : null;
  var draft = existing ? JSON.parse(JSON.stringify(existing)) : {
    name:'', tags:[], servingsBase:4, prepMin:null, cookMin:null, photo:null,
    ingredients:[], steps:[], notes:'', favorite:false, needsDetails:false, source:{type:'manual'}
  };

  var body = el('div');

  var nameInput = el('input', {type:'text', placeholder:'Recipe name', value: draft.name});
  body.appendChild(el('div', {class:'field'}, [el('label',{},['Name']), nameInput]));

  var photoWrap = el('div');
  var photoInput = el('input', {type:'file', accept:'image/*', style:'display:none;', onchange: function(e){
    var file = e.target.files[0];
    if (!file) return;
    readAndResizePhoto(file, 640, 0.72, function(dataUrl){
      draft.photo = dataUrl;
      renderPhotoPicker();
    });
  }});
  function renderPhotoPicker(){
    photoWrap.innerHTML = '';
    if (draft.photo){
      photoWrap.appendChild(el('div', {class:'photo-picker'}, [
        el('img', {src: draft.photo, onclick: function(){ photoInput.click(); }}),
        el('button', {type:'button', class:'pp-remove', onclick: function(e){ e.stopPropagation(); draft.photo = null; renderPhotoPicker(); }}, ['×'])
      ]));
    } else {
      photoWrap.appendChild(el('button', {type:'button', class:'photo-picker-empty', onclick: function(){ photoInput.click(); }}, ['+ Add a photo']));
    }
  }
  renderPhotoPicker();
  body.appendChild(el('div', {class:'field'}, [el('label',{},['Photo']), photoWrap, photoInput]));

  var tagSelect = el('div', {class:'tag-select'});
  MEAL_TAGS.forEach(function(tag){
    var active = draft.tags && draft.tags.indexOf(tag) !== -1;
    var chip = el('button', { type:'button', class:'chip'+(active?' active':''), onclick: function(){
      draft.tags = draft.tags || [];
      var idx = draft.tags.indexOf(tag);
      if (idx===-1) draft.tags.push(tag); else draft.tags.splice(idx,1);
      chip.classList.toggle('active');
    }}, [tag]);
    tagSelect.appendChild(chip);
  });
  body.appendChild(el('div', {class:'field'}, [el('label',{},['Tags']), tagSelect]));

  var servingsInput = el('input', {type:'number', min:'1', value: draft.servingsBase||4});
  var prepInput = el('input', {type:'number', min:'0', placeholder:'min', value: draft.prepMin||''});
  var cookInput = el('input', {type:'number', min:'0', placeholder:'min', value: draft.cookMin||''});
  body.appendChild(el('div', {class:'field-row'}, [
    el('div', {class:'field'}, [el('label',{},['Servings']), servingsInput]),
    el('div', {class:'field'}, [el('label',{},['Prep (min)']), prepInput]),
    el('div', {class:'field'}, [el('label',{},['Cook (min)']), cookInput])
  ]));

  // Ingredients
  body.appendChild(el('div', {class:'section-title'}, ['Ingredients']));
  var ingWrap = el('div');
  body.appendChild(ingWrap);
  function renderIngRows(){
    ingWrap.innerHTML = '';
    (draft.ingredients||[]).forEach(function(ing, idx){
      var qty = el('input', {class:'qty', type:'number', step:'any', placeholder:'qty', value: ing.qty||'',
        oninput: function(e){ ing.qty = e.target.value; }});
      var unit = el('select', {class:'unit', onchange: function(e){ ing.unit = e.target.value; }});
      UNITS.forEach(function(u){ var o = el('option',{value:u},[u||'unit']); if (u===ing.unit) o.selected=true; unit.appendChild(o); });
      var item = el('input', {class:'item', type:'text', placeholder:'ingredient', value: ing.item||'',
        oninput: function(e){ ing.item = e.target.value; }});
      var cat = el('select', {class:'cat', onchange: function(e){ ing.category = e.target.value; }});
      CATEGORIES.forEach(function(c){ var o = el('option',{value:c},[c]); if (c===(ing.category||'Other')) o.selected=true; cat.appendChild(o); });
      var rm = el('button', {class:'rm', type:'button', onclick: function(){ draft.ingredients.splice(idx,1); renderIngRows(); }}, ['×']);
      ingWrap.appendChild(el('div', {class:'ing-row'}, [qty, unit, item, cat, rm]));
    });
  }
  renderIngRows();
  body.appendChild(el('button', {type:'button', class:'add-row-btn', onclick: function(){
    draft.ingredients = draft.ingredients || [];
    draft.ingredients.push({qty:'', unit:'', item:'', category:'Other'});
    renderIngRows();
  }}, ['+ Add ingredient']));

  // Steps
  body.appendChild(el('div', {class:'section-title'}, ['Steps']));
  var stepWrap = el('div');
  body.appendChild(stepWrap);
  function renderStepRows(){
    stepWrap.innerHTML = '';
    (draft.steps||[]).forEach(function(step, idx){
      var ta = el('textarea', {rows:'2', placeholder:'Step ' + (idx+1), oninput: function(e){ draft.steps[idx] = e.target.value; }}, [step]);
      var rm = el('button', {class:'rm', type:'button', onclick: function(){ draft.steps.splice(idx,1); renderStepRows(); }}, ['×']);
      stepWrap.appendChild(el('div', {class:'step-row'}, [el('div',{class:'num'},[String(idx+1)]), ta, rm]));
    });
  }
  renderStepRows();
  body.appendChild(el('button', {type:'button', class:'add-row-btn', onclick: function(){
    draft.steps = draft.steps || [];
    draft.steps.push('');
    renderStepRows();
  }}, ['+ Add step']));

  var notesInput = el('textarea', {rows:'3', placeholder:'Notes (swaps, tips, who likes it…)'}, [draft.notes||'']);
  body.appendChild(el('div', {class:'field', style:'margin-top:16px;'}, [el('label',{},['Notes']), notesInput]));

  body.appendChild(el('div', {style:'height:8px;'}));
  body.appendChild(el('button', {class:'btn btn-primary btn-block', onclick: function(){
    draft.name = nameInput.value.trim();
    if (!draft.name){ toast('Give it a name first'); return; }
    draft.servingsBase = parseInt(servingsInput.value)||4;
    draft.prepMin = prepInput.value ? parseInt(prepInput.value) : null;
    draft.cookMin = cookInput.value ? parseInt(cookInput.value) : null;
    draft.notes = notesInput.value;
    draft.ingredients = (draft.ingredients||[]).filter(function(i){ return i.item && i.item.trim(); });
    draft.steps = (draft.steps||[]).filter(function(s){ return s && s.trim(); });
    draft.needsDetails = draft.ingredients.length === 0 && draft.steps.length === 0 ? draft.needsDetails : false;
    Store.put('recipes', draft);
    closeSheet();
    switchTab('recipes');
    toast(existing ? 'Recipe updated' : 'Recipe added');
  }}, [existing ? 'Save changes' : 'Save recipe']));

  openSheet(existing ? 'Edit recipe' : 'Add a recipe', body, true);
}

/* ---------------------------------------------------------
   Cook mode
--------------------------------------------------------- */
function startCookMode(recipeId){
  var r = Store.get().recipes[recipeId];
  if (!r || !(r.steps||[]).length) return;
  State.cookRecipeId = recipeId;
  State.cookStep = 0;
  if (navigator.wakeLock){
    navigator.wakeLock.request('screen').then(function(lock){ State.wakeLock = lock; }).catch(function(){});
  }
  renderCookMode();
  $('#cookmode').classList.add('open');
}
function exitCookMode(){
  $('#cookmode').classList.remove('open');
  if (State.wakeLock){ State.wakeLock.release().catch(function(){}); State.wakeLock = null; }
}
function renderCookMode(){
  var r = Store.get().recipes[State.cookRecipeId];
  var el2 = $('#cookmode');
  el2.innerHTML = '';
  var steps = r.steps || [];
  el2.appendChild(el('div', {class:'cook-top'}, [
    el('span', {style:'font-weight:600;'}, [r.name]),
    el('button', {onclick: exitCookMode}, ['Done'])
  ]));
  el2.appendChild(el('div', {class:'cook-progress'}, ['Step ' + (State.cookStep+1) + ' of ' + steps.length]));
  el2.appendChild(el('div', {class:'cook-step-text'}, [steps[State.cookStep]]));
  var nav = el('div', {class:'cook-nav'});
  nav.appendChild(el('button', { disabled: State.cookStep===0, style: State.cookStep===0?'opacity:.35':'', onclick: function(){ if(State.cookStep>0){ State.cookStep--; renderCookMode(); } } }, ['Back']));
  if (State.cookStep < steps.length-1){
    nav.appendChild(el('button', { class:'primary', onclick: function(){ State.cookStep++; renderCookMode(); } }, ['Next']));
  } else {
    nav.appendChild(el('button', { class:'primary', onclick: function(){
      r.timesCooked = (r.timesCooked||0)+1;
      r.lastCooked = todayISO();
      Store.put('recipes', r);
      exitCookMode();
      toast('Nice — logged as cooked');
    } }, ['Finish']));
  }
  el2.appendChild(nav);
}

/* ---------------------------------------------------------
   Render: Grocery
--------------------------------------------------------- */
function renderGrocery(){
  var root = $('#screen-grocery');
  root.innerHTML = '';

  var addRow = el('div', {class:'grocery-add'});
  var addInput = el('input', {type:'text', placeholder:'Add an item…'});
  var addBtn = el('button', {class:'btn btn-primary', onclick: submitAdd}, ['Add']);
  function submitAdd(){
    var v = addInput.value.trim();
    if (!v) return;
    Store.put('groceryItems', { name: v, unit:'', qty:null, category:'Other', source:'manual', checked:false });
    addInput.value = '';
    renderGroceryList();
  }
  addInput.addEventListener('keydown', function(e){ if (e.key==='Enter') submitAdd(); });
  addRow.appendChild(addInput);
  addRow.appendChild(addBtn);
  root.appendChild(addRow);

  var toolRow = el('div', {style:'display:flex;gap:8px;margin-bottom:16px;'}, [
    el('button', {class:'btn btn-ghost', style:'flex:1;font-size:13.5px;padding:9px;', onclick: shareList}, ['Share list']),
    el('button', {class:'btn btn-ghost', style:'flex:1;font-size:13.5px;padding:9px;', onclick: function(){
      Store.get().weekChecks[State.weekStart] = {};
      Store.list('groceryItems').forEach(function(i){ i.checked=false; Store.put('groceryItems', i); });
      Store.persist();
      renderGroceryList();
      toast('Checkmarks reset');
    }}, ['Reset checks'])
  ]);
  root.appendChild(toolRow);

  if (Store.get().kroger.accessToken){
    root.appendChild(el('button', {class:'btn btn-primary btn-block', style:'margin-bottom:16px;', onclick: sendGroceryListToKroger}, ['Send to Kroger']));
  }

  root.appendChild(el('div', {id:'groceryListWrap'}));
  renderGroceryList();
}

function buildCombinedGroceryList(){
  var auto = computeAutoGroceryItems(State.weekStart);
  var wc = getWeekChecks(State.weekStart);
  var manual = Store.list('groceryItems');

  var byCat = {};
  CATEGORIES.forEach(function(c){ byCat[c] = []; });

  auto.forEach(function(item){
    var key = normalize(item.name)+'|'+normalize(item.unit);
    var cat = byCat[item.category] ? item.category : 'Other';
    byCat[cat].push({
      key:key, name: titleCase(item.name), unit:item.unit, qty:item.qty,
      checked: !!wc[key], kind:'auto', recipes:item.recipes
    });
  });
  manual.forEach(function(item){
    var cat = byCat[item.category] ? item.category : 'Other';
    byCat[cat].push({
      key:'manual:'+item.id, name:item.name, unit:item.unit, qty:item.qty,
      checked: !!item.checked, kind:'manual', id:item.id
    });
  });
  return byCat;
}

function renderGroceryList(){
  var wrap = $('#groceryListWrap');
  if (!wrap) return;
  wrap.innerHTML = '';
  var byCat = buildCombinedGroceryList();
  var order = Store.get().settings.categoryOrder || CATEGORIES;
  var any = false;

  order.forEach(function(cat){
    var items = byCat[cat] || [];
    if (!items.length) return;
    any = true;
    items.sort(function(a,b){ return (a.checked - b.checked) || a.name.localeCompare(b.name); });
    var group = el('div', {class:'cat-group'});
    group.appendChild(el('div', {class:'cat-title'}, [cat]));
    var cardWrap = el('div', {class:'card-wrap'});
    items.forEach(function(item){
      var row = el('div', {class:'g-item' + (item.checked?' checked':'')});
      var check = el('button', {class:'g-check' + (item.checked?' checked':''), onclick: function(){
        if (item.kind === 'auto') toggleAutoCheck(State.weekStart, item.key);
        else {
          var rec = Store.get().groceryItems[item.id];
          rec.checked = !rec.checked;
          Store.put('groceryItems', rec);
        }
        renderGroceryList();
      }}, [item.checked ? checkIcon() : '']);
      row.appendChild(check);
      var qtyStr = [item.qty ? fmtQty(item.qty) : '', item.unit].filter(Boolean).join(' ');
      row.appendChild(el('span', {class:'g-text'}, [item.name, qtyStr ? el('span',{class:'g-qty'},[qtyStr]) : null]));
      if (item.kind === 'manual'){
        row.appendChild(el('button', {class:'g-del', onclick: function(){ Store.softDelete('groceryItems', item.id); renderGroceryList(); }}, ['×']));
      }
      cardWrap.appendChild(row);
    });
    group.appendChild(cardWrap);
    wrap.appendChild(group);
  });

  if (!any){
    wrap.appendChild(el('div', {class:'empty-state'}, [
      el('h3', {}, ['List is empty']),
      el('p', {}, ['Assign a few dinners on This Week, or add items by hand.'])
    ]));
  }
}
function checkIcon(){
  var span = document.createElement('span');
  span.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>';
  return span;
}

function shareList(){
  var byCat = buildCombinedGroceryList();
  var order = Store.get().settings.categoryOrder || CATEGORIES;
  var lines = ['Grocery list:'];
  order.forEach(function(cat){
    var items = (byCat[cat]||[]).filter(function(i){ return !i.checked; });
    if (!items.length) return;
    lines.push('');
    lines.push(cat + ':');
    items.forEach(function(i){
      var qtyStr = [i.qty ? fmtQty(i.qty) : '', i.unit].filter(Boolean).join(' ');
      lines.push('- ' + i.name + (qtyStr ? ' ('+qtyStr+')' : ''));
    });
  });
  var text = lines.join('\n');
  if (lines.length <= 1){ toast('Nothing to share yet'); return; }

  if (navigator.share){
    navigator.share({ text: text }).catch(function(){});
  } else if (navigator.clipboard){
    navigator.clipboard.writeText(text).then(function(){ toast('Copied to clipboard'); });
  } else {
    prompt('Copy your list:', text);
  }
}

/* ---------------------------------------------------------
   Render: Settings
--------------------------------------------------------- */
function renderSettings(){
  var root = $('#screen-settings');
  root.innerHTML = '';
  var s = Store.get().settings;

  // Household
  var group1 = el('div', {class:'settings-group'});
  group1.appendChild(el('h3', {}, ['Household']));
  var card1 = el('div', {class:'card', style:'padding:4px 14px;'});
  var sizeInput = el('input', {type:'number', min:'1', value: s.householdSize, style:'width:70px;text-align:center;',
    onchange: function(e){ Store.saveSettings({householdSize: parseInt(e.target.value)||4}); }});
  card1.appendChild(el('div', {class:'toggle-row'}, [
    el('div', {class:'lbl'}, ['Default servings', el('span',{class:'d'},['Used for new recipes'])]),
    sizeInput
  ]));
  group1.appendChild(card1);
  root.appendChild(group1);

  // Kroger account
  var groupK = el('div', {class:'settings-group'});
  groupK.appendChild(el('h3', {}, ['Kroger account']));
  var kroger = Store.get().kroger;
  var cardK = el('div', {class:'card', style:'padding:14px;'});

  var workerInput = el('input', {type:'text', placeholder:'https://your-worker.workers.dev', value: kroger.workerUrl,
    onchange: function(e){ var k = Store.get().kroger; k.workerUrl = e.target.value.trim(); Store.persist(); }});
  cardK.appendChild(el('div', {class:'field'}, [el('label',{},['Worker URL']), workerInput]));

  var isConnected = !!kroger.accessToken;
  if (isConnected){
    cardK.appendChild(el('div', {style:'display:flex;align-items:center;gap:8px;margin:4px 0 12px;color:var(--herb-dark);font-weight:600;font-size:14px;'}, [
      el('span', {}, ['✓ Connected'])
    ]));
    cardK.appendChild(el('button', {class:'btn btn-ghost btn-block', onclick: disconnectKroger}, ['Disconnect']));
  } else {
    cardK.appendChild(el('button', {class:'btn btn-primary btn-block', onclick: startKrogerConnect}, ['Connect Kroger account']));
  }
  groupK.appendChild(cardK);
  groupK.appendChild(el('p', {style:'font-size:12.5px;color:var(--ink-soft);margin:8px 4px 0;'}, ['Paste the Worker URL from its deploy output first. "Connect" opens Kroger\u2019s own login — Supper never sees the password.']));
  root.appendChild(groupK);

  // Category order
  var group2 = el('div', {class:'settings-group'});
  group2.appendChild(el('h3', {}, ['Grocery list order']));
  var card2 = el('div', {class:'card', style:'padding:4px 14px;'});
  function renderOrder(){
    card2.innerHTML = '';
    s.categoryOrder.forEach(function(cat, idx){
      card2.appendChild(el('div', {class:'reorder-row'}, [
        el('span', {class:'rname'}, [cat]),
        el('div', {class:'arrows'}, [
          el('button', {disabled: idx===0, style: idx===0?'opacity:.3':'', onclick: function(){
            if (idx>0){ var arr=s.categoryOrder; var t=arr[idx-1]; arr[idx-1]=arr[idx]; arr[idx]=t; Store.saveSettings({categoryOrder:arr}); renderOrder(); }
          }}, ['↑']),
          el('button', {disabled: idx===s.categoryOrder.length-1, style: idx===s.categoryOrder.length-1?'opacity:.3':'', onclick: function(){
            if (idx<s.categoryOrder.length-1){ var arr=s.categoryOrder; var t=arr[idx+1]; arr[idx+1]=arr[idx]; arr[idx]=t; Store.saveSettings({categoryOrder:arr}); renderOrder(); }
          }}, ['↓'])
        ])
      ]));
    });
  }
  renderOrder();
  group2.appendChild(card2);
  group2.appendChild(el('p', {style:'font-size:12.5px;color:var(--ink-soft);margin:8px 4px 0;'}, ['Set this to match the aisle walk at your Kroger — reorder once and the list will always sort this way.']));
  root.appendChild(group2);

  // Staples
  var group3 = el('div', {class:'settings-group'});
  group3.appendChild(el('h3', {}, ['Pantry staples']));
  group3.appendChild(el('p', {style:'font-size:12.5px;color:var(--ink-soft);margin:0 4px 10px;'}, ['Things you always have on hand — left off the auto-generated list.']));
  var card3 = el('div', {class:'card', style:'padding:4px 14px;'});
  function renderStaples(){
    card3.innerHTML = '';
    var staples = Store.list('staples');
    if (!staples.length){
      card3.appendChild(el('div', {style:'padding:14px 2px;color:var(--ink-soft);font-size:13.5px;'}, ['None yet']));
    }
    staples.forEach(function(st){
      card3.appendChild(el('div', {class:'staple-row'}, [
        el('span', {class:'sname'}, [st.name]),
        el('button', {class:'g-del', onclick: function(){ Store.softDelete('staples', st.id); renderStaples(); }}, ['×'])
      ]));
    });
  }
  renderStaples();
  group3.appendChild(card3);
  var stapleInput = el('input', {type:'text', placeholder:'e.g. olive oil, kosher salt', style:'margin-top:10px;'});
  stapleInput.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && stapleInput.value.trim()){
      Store.put('staples', {name: stapleInput.value.trim(), autoExclude:true});
      stapleInput.value = '';
      renderStaples();
    }
  });
  group3.appendChild(stapleInput);
  root.appendChild(group3);

  // Kroger product matches (seeded from receipts)
  var group3b = el('div', {class:'settings-group'});
  var matchCount = Store.list('krogerMatches').length;
  group3b.appendChild(el('h3', {}, ['Kroger matches (' + matchCount + ')']));
  group3b.appendChild(el('p', {style:'font-size:12.5px;color:var(--ink-soft);margin:0 4px 10px;'}, ['Products matched to a real UPC — from receipts, and from picks made on the "Find it" flow when sending your grocery list to Kroger. Grows on its own; delete a match here if it ever picks the wrong product.']));
  var matchSearch = el('input', {type:'search', placeholder:'Search matched products…', style:'margin-bottom:10px;'});
  group3b.appendChild(matchSearch);
  var card3b = el('div', {class:'card', style:'padding:4px 14px;max-height:340px;overflow-y:auto;'});
  function renderMatches(q){
    card3b.innerHTML = '';
    var all = Store.list('krogerMatches').sort(function(a,b){ return (b.orderedCount||0)-(a.orderedCount||0) || a.name.localeCompare(b.name); });
    var filtered = all.filter(function(m){ return !q || normalize(m.name).indexOf(normalize(q)) !== -1; });
    if (!filtered.length){
      card3b.appendChild(el('div', {style:'padding:14px 2px;color:var(--ink-soft);font-size:13.5px;'}, [q ? 'No matches found' : 'None yet']));
      return;
    }
    filtered.slice(0, 200).forEach(function(m){
      card3b.appendChild(el('div', {class:'staple-row'}, [
        el('span', {class:'sname'}, [
          m.name,
          el('span', {style:'display:block;font-size:11.5px;color:var(--ink-soft);margin-top:2px;'}, [m.category + ' · seen ' + (m.orderedCount||1) + 'x · ' + m.upc])
        ]),
        el('button', {class:'g-del', onclick: function(){ Store.softDelete('krogerMatches', m.id); renderMatches(matchSearch.value); }}, ['×'])
      ]));
    });
  }
  renderMatches('');
  matchSearch.addEventListener('input', function(){ renderMatches(matchSearch.value); });
  group3b.appendChild(card3b);
  root.appendChild(group3b);

  // Data
  var group4 = el('div', {class:'settings-group'});
  group4.appendChild(el('h3', {}, ['Your data']));
  var card4 = el('div', {class:'card', style:'padding:14px;'});
  card4.appendChild(el('button', {class:'btn btn-ghost btn-block', style:'margin-bottom:10px;', onclick: exportData}, ['Export as JSON']));
  var fileInput = el('input', {type:'file', accept:'.json', style:'display:none;', onchange: importData});
  card4.appendChild(el('button', {class:'btn btn-ghost btn-block', onclick: function(){ fileInput.click(); }}, ['Import from JSON']));
  card4.appendChild(fileInput);
  group4.appendChild(card4);
  group4.appendChild(el('p', {style:'font-size:12.5px;color:var(--ink-soft);margin:8px 4px 0;'}, ['Export regularly — this file is the backup. Nothing here is synced to the cloud yet.']));
  root.appendChild(group4);

  root.appendChild(el('div', {style:'text-align:center;color:var(--ink-soft);font-size:12px;padding:20px 0 8px;'}, ['Supper · v0.1']));
}

function exportData(){
  var data = Store.get();
  var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'supper-backup-' + todayISO() + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  toast('Exported');
}
function importData(e){
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(evt){
    try {
      var parsed = JSON.parse(evt.target.result);
      if (!confirm('This replaces everything currently in the app with the imported file. Continue?')) return;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
      location.reload();
    } catch(err){
      toast("Couldn't read that file");
    }
  };
  reader.readAsText(file);
}

--------------------------------------------------------- */
function openSheet(title, bodyEl, showCancel, wide){
  var backdrop = $('#sheetBackdrop');
  var sheet = $('#sheet');
  sheet.innerHTML = '';
  sheet.style.maxHeight = wide ? '94vh' : '86vh';
  var header = el('div', {class:'sheet-header'}, [
    el('h2', {}, [title]),
    el('button', {onclick: closeSheet}, ['Close'])
  ]);
  var body = el('div', {class:'sheet-body'}, [bodyEl]);
  sheet.appendChild(header);
  sheet.appendChild(body);
  backdrop.classList.add('open');
}
function closeSheet(){
  $('#sheetBackdrop').classList.remove('open');
}
$('#sheetBackdrop').addEventListener('click', function(e){
  if (e.target === $('#sheetBackdrop')) closeSheet();
});

if ('serviceWorker' in navigator){

})();
