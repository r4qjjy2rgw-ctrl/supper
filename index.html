<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Supper</title>
<meta name="theme-color" content="#3F6E52">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Supper">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5EEDD;
    --card:#FFFDF7;
    --ink:#2B2118;
    --ink-soft:#6B5E4C;
    --herb:#3F6E52;
    --herb-dark:#2E5240;
    --clay:#C1592C;
    --gold:#C99A1E;
    --line:#E4D9C0;
    --danger:#B23B3B;
    --radius:16px;
    --radius-sm:10px;
    --shadow:0 1px 2px rgba(43,33,24,.06), 0 4px 14px rgba(43,33,24,.06);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  h1,h2,h3,.serif{
    font-family:'Fraunces', Georgia, serif;
    font-weight:600;
    letter-spacing:-0.01em;
    margin:0;
  }
  button{font-family:inherit;}
  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    position:relative;
  }
  header.topbar{
    padding:calc(18px + var(--safe-top)) 20px 14px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
  }
  header.topbar h1{font-size:26px;}
  header.topbar .sub{font-size:13px;color:var(--ink-soft);margin-top:2px;}
  header.topbar .actions{display:flex;gap:8px;align-items:center;}
  main{flex:1;padding:0 16px calc(96px + var(--safe-bottom));}
  .screen{display:none;}
  .screen.active{display:block;animation:fadein .18s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  nav.tabbar{
    position:fixed;
    bottom:0;left:0;right:0;
    max-width:520px;
    margin:0 auto;
    background:rgba(250,246,236,.94);
    backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    display:flex;
    padding:8px 6px calc(8px + var(--safe-bottom));
    z-index:40;
  }
  nav.tabbar button{
    flex:1;
    background:none;border:none;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:6px 2px;
    color:var(--ink-soft);
    font-size:11px;
    border-radius:12px;
  }
  nav.tabbar button svg{width:22px;height:22px;}
  nav.tabbar button.active{color:var(--herb-dark);}
  nav.tabbar button.active svg{stroke:var(--herb-dark);}

  /* Cards */
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  .section-title{
    font-size:12px;
    color:var(--ink-soft);
    margin:22px 2px 8px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .section-title:first-child{margin-top:0;}

  /* Week screen */
  .week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
  .week-nav button{background:var(--card);border:1px solid var(--line);width:34px;height:34px;border-radius:10px;color:var(--herb-dark);font-size:18px;display:flex;align-items:center;justify-content:center;}
  .week-nav .range{font-size:13px;color:var(--ink-soft);}
  .view-toggle{display:flex;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:3px;margin-bottom:16px;}
  .view-toggle button{flex:1;padding:9px 0;border:none;background:none;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--ink-soft);transition:background .15s, color .15s;}
  .view-toggle button.active{background:var(--herb);color:#fff;}
  .week-glance{display:flex;gap:6px;margin-bottom:14px;}
  .glance-pill{flex:1;text-align:center;padding:9px 0;border-radius:10px;border:1.5px solid var(--line);font-size:12px;font-weight:700;color:var(--ink-soft);background:var(--card);}
  .glance-pill.filled{color:#fff;}
  .week-shelf{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:2px 2px 8px;}
  .shelf-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);text-align:left;cursor:pointer;overflow:hidden;}
  .shelf-card .sc-photo{width:100%;height:92px;object-fit:cover;display:block;}
  .shelf-card .sc-photo-placeholder{width:100%;height:92px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Fraunces',serif;font-size:26px;font-weight:600;}
  .shelf-card .sc-body{padding:10px 12px 12px;}
  .shelf-card .sc-name{font-size:14px;font-weight:600;line-height:1.3;display:block;}
  .shelf-card .sc-meta{font-size:11.5px;color:var(--ink-soft);margin-top:6px;}
  .shelf-card .sc-remove{position:absolute;top:7px;right:7px;width:22px;height:22px;border-radius:50%;background:rgba(43,33,24,.55);color:#fff;border:none;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;z-index:2;}
  .shelf-add{min-height:150px;border:1.5px dashed var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--herb-dark);font-weight:600;font-size:13px;background:none;text-align:center;padding:10px;}
  .day-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 14px;
    margin-bottom:8px;
  }
  .day-row .date{
    width:44px;flex-shrink:0;text-align:center;
  }
  .day-row .date .dow{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
  .day-row .date .num{font-family:'Fraunces',serif;font-size:20px;font-weight:600;}
  .day-row.is-today{border-color:var(--herb);}
  .day-row.is-today .date .num{color:var(--herb-dark);}
  .day-slot{flex:1;min-width:0;text-align:left;background:none;border:none;padding:0;}
  .day-slot .meal-name{font-size:15px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .day-slot .meal-empty{font-size:13px;color:var(--herb-dark);font-weight:600;border:1.5px dashed var(--line);padding:6px 12px;border-radius:99px;display:inline-block;}
  .day-slot .meal-tag{font-size:12px;color:var(--ink-soft);}
  .day-row .clear-btn{background:none;border:none;color:var(--ink-soft);font-size:18px;padding:4px 6px;flex-shrink:0;}

  /* Recipes */
  .recipe-search{
    display:flex;gap:8px;margin-bottom:14px;
  }
  input[type=text],input[type=number],input[type=search],select,textarea{
    font-family:inherit;
    font-size:15px;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    background:var(--card);
    color:var(--ink);
    width:100%;
  }
  textarea{resize:vertical;min-height:60px;}
  .recipe-search input{flex:1;}
  .chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .chip{
    font-size:12.5px;padding:6px 12px;border-radius:99px;
    border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
  }
  .chip.active{background:var(--herb);border-color:var(--herb);color:#fff;}
  .recipe-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .recipe-tile{
    padding:0;
    text-align:left;
    position:relative;
    background:var(--card);
    overflow:hidden;
  }
  .recipe-tile .rt-photo{width:100%;height:100px;object-fit:cover;display:block;}
  .recipe-tile .rt-photo-placeholder{width:100%;height:100px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Fraunces',serif;font-size:30px;font-weight:600;}
  .recipe-tile .rt-body{padding:12px 12px 14px;min-height:56px;display:flex;flex-direction:column;justify-content:space-between;}
  .recipe-tile .rt-name{font-size:14.5px;font-weight:600;line-height:1.25;}
  .recipe-tile .rt-meta{font-size:11.5px;color:var(--ink-soft);margin-top:8px;display:flex;justify-content:space-between;align-items:center;}
  .recipe-tile .star{color:var(--gold);font-size:14px;}
  .needs-badge{
    font-size:10px;color:var(--clay);border:1px solid var(--clay);
    padding:1px 6px;border-radius:99px;display:inline-block;margin-top:6px;
  }
  .empty-state{
    text-align:center;padding:40px 20px;color:var(--ink-soft);
  }
  .empty-state h3{color:var(--ink);margin-bottom:6px;font-size:17px;}
  .empty-state p{font-size:14px;line-height:1.5;margin:0 0 16px;}

  /* Buttons */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:12px 18px;border-radius:99px;border:none;
    font-size:15px;font-weight:600;cursor:pointer;
  }
  .btn-primary{background:var(--herb);color:#fff;}
  .btn-primary:active{background:var(--herb-dark);}
  .btn-ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);}
  .btn-danger{background:none;color:var(--danger);}
  .btn-block{width:100%;}
  .fab-wrap{position:sticky;bottom:0;padding:14px 0 0;background:linear-gradient(to top, var(--paper) 60%, transparent);margin-top:-8px;}

  /* Grocery */
  .grocery-add{display:flex;gap:8px;margin-bottom:16px;}
  .grocery-add input{flex:1;}
  .cat-group{margin-bottom:18px;}
  .cat-title{font-size:12px;font-weight:600;color:var(--herb-dark);text-transform:uppercase;letter-spacing:.05em;margin:0 0 8px 2px;}
  .g-item{
    display:flex;align-items:center;gap:12px;
    padding:11px 14px;border-bottom:1px solid var(--line);
    background:var(--card);
  }
  .g-item:first-child{border-radius:var(--radius) var(--radius) 0 0;}
  .g-item:last-child{border-bottom:none;border-radius:0 0 var(--radius) var(--radius);}
  .cat-group .card-wrap{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
  .g-check{
    width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;background:#fff;
  }
  .g-check.checked{background:var(--herb);border-color:var(--herb);}
  .g-check.checked svg{stroke:#fff;}
  .g-text{flex:1;min-width:0;font-size:14.5px;}
  .g-item.checked .g-text{color:var(--ink-soft);text-decoration:line-through;}
  .g-qty{color:var(--ink-soft);font-size:13px;margin-left:4px;}
  .g-del{background:none;border:none;color:var(--ink-soft);font-size:18px;padding:2px 4px;}

  /* Modal / sheet */
  .sheet-backdrop{
    position:fixed;inset:0;background:rgba(43,33,24,.4);z-index:50;
    display:none;align-items:flex-end;justify-content:center;
  }
  .sheet-backdrop.open{display:flex;}
  .sheet{
    background:var(--paper);
    width:100%;max-width:520px;
    max-height:92vh;
    border-radius:22px 22px 0 0;
    display:flex;flex-direction:column;
    animation:slideup .22s ease;
    padding-bottom: var(--safe-bottom);
  }
  @keyframes slideup{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
  .sheet-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 18px 10px;border-bottom:1px solid var(--line);
  }
  .sheet-header h2{font-size:19px;}
  .sheet-header button{background:none;border:none;color:var(--ink-soft);font-size:15px;padding:6px;}
  .sheet-body{overflow-y:auto;padding:16px 18px 24px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;font-weight:600;}
  .field-row{display:flex;gap:8px;}
  .field-row > *{flex:1;}
  .ing-row{display:flex;gap:6px;margin-bottom:8px;align-items:center;}
  .ing-row .qty{width:56px;flex:none;}
  .ing-row .unit{width:76px;flex:none;}
  .ing-row .item{flex:1;}
  .ing-row .cat{width:100px;flex:none;}
  .ing-row .rm{background:none;border:none;color:var(--ink-soft);font-size:18px;flex:none;padding:2px 4px;}
  .step-row{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start;}
  .step-row .num{width:22px;flex:none;padding-top:10px;color:var(--ink-soft);font-size:13px;font-weight:600;}
  .step-row textarea{flex:1;}
  .step-row .rm{background:none;border:none;color:var(--ink-soft);font-size:18px;flex:none;padding:10px 4px;}
  .add-row-btn{background:none;border:1px dashed var(--line);color:var(--herb-dark);font-size:13.5px;padding:9px;border-radius:var(--radius-sm);width:100%;font-weight:600;}
  .tag-select{display:flex;flex-wrap:wrap;gap:6px;}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;border-bottom:1px solid var(--line);}
  .toggle-row:last-child{border-bottom:none;}
  .toggle-row .lbl{font-size:14.5px;}
  .toggle-row .lbl .d{font-size:12px;color:var(--ink-soft);display:block;margin-top:2px;}
  .switch{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;border:none;flex-shrink:0;}
  .switch.on{background:var(--herb);}
  .switch::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s;}
  .switch.on::after{transform:translateX(18px);}

  /* Recipe detail */
  .detail-hero{padding:6px 2px 14px;}
  .detail-photo{width:100%;height:190px;object-fit:cover;border-radius:14px;margin-bottom:4px;display:block;}
  .photo-picker{position:relative;border-radius:14px;overflow:hidden;}
  .photo-picker img{width:100%;height:180px;object-fit:cover;display:block;cursor:pointer;}
  .photo-picker .pp-remove{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:rgba(43,33,24,.6);color:#fff;border:none;font-size:15px;display:flex;align-items:center;justify-content:center;}
  .photo-picker-empty{width:100%;height:120px;border:1.5px dashed var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--herb-dark);font-weight:600;font-size:14px;background:none;}
  .detail-hero h2{font-size:23px;line-height:1.2;}
  .detail-meta{display:flex;gap:14px;margin-top:8px;color:var(--ink-soft);font-size:13px;flex-wrap:wrap;}
  .servings-stepper{display:flex;align-items:center;gap:10px;margin:16px 0;}
  .servings-stepper button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-size:16px;}
  .servings-stepper .n{font-weight:600;font-size:16px;min-width:70px;text-align:center;}
  .ing-list{list-style:none;margin:0;padding:0;}
  .ing-list li{padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px;display:flex;justify-content:space-between;gap:10px;}
  .ing-list li:last-child{border-bottom:none;}
  .ing-list .amt{color:var(--ink-soft);flex-shrink:0;}
  .steps-list{list-style:none;margin:0;padding:0;counter-reset:step;}
  .steps-list li{padding:12px 0;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.5;display:flex;gap:12px;}
  .steps-list li:last-child{border-bottom:none;}
  .steps-list li::before{
    counter-increment:step;content:counter(step);
    width:24px;height:24px;border-radius:50%;background:var(--herb);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;
  }
  .detail-actions{display:flex;gap:8px;margin-top:20px;}
  .detail-actions .btn{flex:1;}

  /* Cook mode */
  #cookmode{
    position:fixed;inset:0;background:var(--ink);color:#FAF6EE;z-index:60;
    display:none;flex-direction:column;padding: calc(20px + var(--safe-top)) 24px calc(24px + var(--safe-bottom));
  }
  #cookmode.open{display:flex;}
  .cook-top{display:flex;justify-content:space-between;align-items:center;}
  .cook-top button{background:none;border:none;color:#FAF6EE;font-size:15px;opacity:.8;}
  .cook-progress{font-size:12px;opacity:.6;margin-top:18px;letter-spacing:.05em;text-transform:uppercase;}
  .cook-step-text{flex:1;display:flex;align-items:center;font-family:'Fraunces',serif;font-size:26px;line-height:1.4;font-weight:500;padding:20px 0;}
  .cook-nav{display:flex;gap:10px;}
  .cook-nav button{flex:1;padding:16px;border-radius:14px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:#FAF6EE;font-size:16px;font-weight:600;}
  .cook-nav button.primary{background:var(--herb);border-color:var(--herb);}

  /* Recipe picker sheet */
  .picker-list{list-style:none;margin:0;padding:0;}
  .picker-item{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:13px 4px;border-bottom:1px solid var(--line);background:none;border:none;
    width:100%;text-align:left;font-size:15px;color:var(--ink);
  }
  .picker-item .pt{color:var(--ink-soft);font-size:12px;}
  .quick-picks{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}

  .toast{
    position:fixed;bottom:calc(90px + var(--safe-bottom));left:50%;transform:translateX(-50%);
    background:var(--ink);color:#FAF6EE;padding:11px 20px;border-radius:99px;font-size:13.5px;
    z-index:70;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;
    max-width:88%;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  .reorder-row{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);}
  .reorder-row:last-child{border-bottom:none;}
  .reorder-row .rname{flex:1;font-size:14.5px;}
  .reorder-row .arrows{display:flex;gap:4px;}
  .reorder-row .arrows button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);}

  .staple-row{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);}
  .staple-row:last-child{border-bottom:none;}
  .staple-row .sname{flex:1;font-size:14.5px;}

  .settings-group{margin-bottom:24px;}
  .settings-group h3{font-size:13px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;}
</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <div>
      <h1 id="screenTitle" class="serif">This Week</h1>
      <div class="sub" id="screenSub"></div>
    </div>
    <div class="actions" id="topbarActions"></div>
  </header>

  <main>
    <section class="screen active" id="screen-week"></section>
    <section class="screen" id="screen-grocery"></section>
    <section class="screen" id="screen-recipes"></section>
    <section class="screen" id="screen-settings"></section>
  </main>

  <nav class="tabbar">
    <button data-tab="week" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
      This Week
    </button>
    <button data-tab="grocery">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 8h14l-1.5 10a2 2 0 0 1-2 1.7H8.7a2 2 0 0 1-2-1.7L5 4H2"/><circle cx="9" cy="21" r="1"/><circle cx="17" cy="21" r="1"/></svg>
      Grocery
    </button>
    <button data-tab="recipes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h11a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3V4Z"/><path d="M18 7h2v13a2 2 0 0 1-2 2H7"/><path d="M8 8h6M8 11h6"/></svg>
      Recipes
    </button>
    <button data-tab="settings">

<script>
(function(){
"use strict";

/* ---------------------------------------------------------
   Constants
--------------------------------------------------------- */
var SCHEMA_VERSION = 1;
var STORAGE_KEY = 'supper_data_v1';

var CATEGORIES = ["Produce","Bakery","Deli","Meat & Seafood","Dairy & Eggs","Frozen",
  "Canned & Jarred","Dry Goods & Pasta","Baking","Snacks","Beverages",
  "Condiments & Spices","Household","Other"];

var UNITS = ["", "cup","tbsp","tsp","oz","lb","g","kg","ml","l","clove","can","jar","pkg","slice","piece"];

var MEAL_TAGS = ["weeknight","kid-friendly","freezer-friendly","grill","slow-cooker","one-pot","soup","dessert","side"];

var DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var DOW_FULL = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

/* ---------------------------------------------------------
   Utilities
--------------------------------------------------------- */
function uuid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c){
    var r = Math.random()*16|0, v = c=='x'?r:(r&0x3|0x8);
    return v.toString(16);
  });
}
function $(sel, root){ return (root||document).querySelector(sel); }
function $all(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function esc(s){ return (s==null?'':String(s)); } // used only where textContent isn't practical; kept minimal
function el(tag, attrs, kids){
  var e = document.createElement(tag);
  attrs = attrs || {};
  for (var k in attrs){
    if (k === 'class') e.className = attrs[k];
    else if (k === 'html') e.innerHTML = attrs[k];
    else if (k.indexOf('on')===0 && typeof attrs[k]==='function') e.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] === false || attrs[k] === null || attrs[k] === undefined) { /* boolean-false: omit attribute entirely */ }
    else if (attrs[k] === true) e.setAttribute(k, '');
    else e.setAttribute(k, attrs[k]);
  }
  (kids||[]).forEach(function(kid){
    if (kid == null) return;
    if (typeof kid === 'string') e.appendChild(document.createTextNode(kid));
    else e.appendChild(kid);
  });
  return e;
}
function fmtDate(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function addDays(d, n){ var r = new Date(d); r.setDate(r.getDate()+n); return r; }
function startOfWeek(d){
  var r = new Date(d);
  r.setHours(0,0,0,0);
  r = addDays(r, -r.getDay());
  return r;
}
function todayISO(){ return fmtDate(new Date()); }
function normalize(s){ return (s||'').trim().toLowerCase().replace(/\s+/g,' '); }
function titleCase(s){ return (s||'').replace(/\w\S*/g, function(t){return t.charAt(0).toUpperCase()+t.substr(1).toLowerCase();}); }
function round2(n){ return Math.round(n*100)/100; }
function fmtQty(n){
  if (n == null || isNaN(n)) return '';
  n = round2(n);
  if (Number.isInteger(n)) return String(n);
  // try common fractions
  var fracs = {0.25:'¼',0.5:'½',0.75:'¾',0.33:'⅓',0.67:'⅔',0.2:'⅕'};
  var whole = Math.floor(n);
  var rem = round2(n - whole);
  if (fracs[rem]) return (whole? whole+' ':'') + fracs[rem];
  return String(n);
}
var ACCENTS = ['#3F6E52','#C1592C','#C99A1E','#5B7C99','#8B5C82'];
function tagColor(tag){
  if (!tag) return null;
  var h = 0;
  for (var i=0;i<tag.length;i++) h = (h*31 + tag.charCodeAt(i)) >>> 0;
  return ACCENTS[h % ACCENTS.length];
}
// Downscale + JPEG-compress a picked photo before it goes into localStorage.
// Phone photos run 3-8MB raw; storage is capped, so every recipe photo needs
// to land well under 200KB or the quota gets eaten fast.
/* ---------------------------------------------------------
   Kroger OAuth (Authorization Code + PKCE)
   Client ID is public by design in this flow — safe to ship in JS.
   The client secret never appears here; it lives only in the Worker.
--------------------------------------------------------- */
var KROGER_CLIENT_ID = 'supperjj-bbch1hm8';
var KROGER_AUTHORIZE_URL = 'https://api.kroger.com/v1/connect/oauth2/authorize';
var KROGER_SCOPES = 'product.compact cart.basic:write profile.compact';
var KROGER_PKCE_STASH_KEY = 'supper_kroger_pkce';

// Normalizes away a trailing index.html so the redirect URI is identical
// whether Supper is opened as a plain browser tab or launched from a
// home-screen icon (which resolves through the PWA manifest's start_url
// and can land on .../supper/index.html instead of .../supper/).
// Without this, the two launch paths compute two different redirect_uri
// values and Kroger rejects whichever one wasn't registered.
function getKrogerRedirectUri(){
  var path = window.location.pathname.replace(/index\.html$/i, '');
  return window.location.origin + path;
}

function base64url(bytes){
  var str = '';
  for (var i=0;i<bytes.length;i++) str += String.fromCharCode(bytes[i]);
  return btoa(str).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function randomPkceString(){
  var arr = new Uint8Array(32);
  crypto.getRandomValues(arr);
  return base64url(arr);
}
function pkceChallenge(verifier){
  var enc = new TextEncoder().encode(verifier);
  return crypto.subtle.digest('SHA-256', enc).then(function(digest){
    return base64url(new Uint8Array(digest));
  });
}

function startKrogerConnect(){
  var kroger = Store.get().kroger;
  if (!kroger.workerUrl){ toast('Add your Worker URL first'); return; }
  var verifier = randomPkceString();
  var state = randomPkceString();
  var redirectUri = getKrogerRedirectUri();
  pkceChallenge(verifier).then(function(challenge){
    localStorage.setItem(KROGER_PKCE_STASH_KEY, JSON.stringify({ verifier: verifier, state: state, redirectUri: redirectUri }));
    var url = KROGER_AUTHORIZE_URL + '?' + new URLSearchParams({
      scope: KROGER_SCOPES,
      response_type: 'code',
      client_id: KROGER_CLIENT_ID,
      redirect_uri: redirectUri,
      state: state,
      code_challenge: challenge,
      code_challenge_method: 'S256'
    }).toString();
    window.location.href = url;
  }).catch(function(){ toast("Couldn't start the Kroger connection"); });
}

function disconnectKroger(){
  var kroger = Store.get().kroger;
  kroger.accessToken = null;
  kroger.refreshToken = null;
  kroger.expiresAt = 0;
  Store.persist();
  render();
}

// Runs once at boot. If the page just came back from Kroger's login
// with a ?code=..., completes the exchange via the Worker and cleans
// the URL so a refresh doesn't try to replay a used code.
function handleKrogerRedirectIfPresent(){
  var params = new URLSearchParams(window.location.search);
  var code = params.get('code');
  if (!code) return;
  var stashRaw = localStorage.getItem(KROGER_PKCE_STASH_KEY);
  window.history.replaceState({}, '', getKrogerRedirectUri());
  if (!stashRaw){ toast('Kroger connect failed — try again'); return; }
  var stash = JSON.parse(stashRaw);
  localStorage.removeItem(KROGER_PKCE_STASH_KEY);
  if (params.get('state') !== stash.state){ toast('Kroger connect failed (state mismatch)'); return; }
  var kroger = Store.get().kroger;
  if (!kroger.workerUrl){ toast('Kroger connect failed — Worker URL missing'); return; }
  fetch(kroger.workerUrl.replace(/\/$/,'') + '/exchange', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ code: code, code_verifier: stash.verifier, redirect_uri: stash.redirectUri })
  }).then(function(r){ return r.json().then(function(data){ return {ok:r.ok, data:data}; }); })
    .then(function(res){
      if (!res.ok || !res.data.access_token){ toast('Kroger connect failed'); console.error(res.data); return; }
      var k = Store.get().kroger;
      k.accessToken = res.data.access_token;
      k.refreshToken = res.data.refresh_token;
      k.expiresAt = Date.now() + (res.data.expires_in*1000);
      Store.persist();
      toast('Kroger connected');
      render();
    })
    .catch(function(){ toast('Kroger connect failed — check the Worker URL'); });
}

// Returns a valid access token, refreshing first if it's expired.
// Used by the (future) cart-push feature.
function ensureKrogerToken(){
  var kroger = Store.get().kroger;
  if (!kroger.accessToken) return Promise.resolve(null);
  if (Date.now() < kroger.expiresAt - 60000) return Promise.resolve(kroger.accessToken);
  if (!kroger.refreshToken || !kroger.workerUrl) return Promise.resolve(null);
  return fetch(kroger.workerUrl.replace(/\/$/,'') + '/refresh', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ refresh_token: kroger.refreshToken })
  }).then(function(r){ return r.json().then(function(data){ return {ok:r.ok, data:data}; }); })
    .then(function(res){
      if (!res.ok || !res.data.access_token) return null;
      var k = Store.get().kroger;
      k.accessToken = res.data.access_token;
      if (res.data.refresh_token) k.refreshToken = res.data.refresh_token;
      k.expiresAt = Date.now() + (res.data.expires_in*1000);
      Store.persist();
      return k.accessToken;
    })
    .catch(function(){ return null; });
}

// Matches a grocery-list item name against the saved Kroger product
// repository (seeded from receipts) by word overlap against each
// product's searchTerms. Returns the best match, or null if nothing
// scores above the minimum bar. This is a heuristic, not exact —
// wrong or missing matches are expected to need occasional correction
// in Settings > Kroger matches.
var KROGER_MATCH_STOPWORDS = ['and','the','with','for','fresh','organic','of','a','or'];

function krogerSearchTerms(name){
  var words = normalize(name).replace(/[^a-z0-9\s]/g, ' ').split(' ')
    .filter(function(w){ return w.length > 2 && KROGER_MATCH_STOPWORDS.indexOf(w) === -1; });
  var seen = [];
  words.forEach(function(w){ if (seen.indexOf(w) === -1) seen.push(w); });
  return seen;
}

// Live product search, used when nothing in the saved repository matches.
// Returns a normalized candidate list regardless of Kroger's exact response
// shape — defensive because this hasn't been confirmed against a real
// response yet; if Kroger's fields differ, candidates may come back empty
// and that's the first thing to check.
function searchKrogerProducts(term){
  var kroger = Store.get().kroger;
  return ensureKrogerToken().then(function(token){
    if (!token || !kroger.workerUrl) return [];
    return fetch(kroger.workerUrl.replace(/\/$/,'') + '/products/search', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ access_token: token, term: term, locationId: kroger.locationId })
    }).then(function(r){ return r.json(); })
      .then(function(data){
        var list = data && (data.data || data.products || []) || [];
        return list.map(function(p){
          var size = (p.items && p.items[0] && p.items[0].size) || '';
          var name = [p.brand, p.description].filter(Boolean).join(' ') || p.description || 'Unnamed product';
          return { upc: p.upc || p.productId, name: size ? (name + ', ' + size) : name };
        }).filter(function(p){ return p.upc; });
      })
      .catch(function(){ return []; });
  });
}

function saveKrogerMatch(upc, name){
  return Store.put('krogerMatches', {
    upc: upc, name: name, category: 'Other',
    searchTerms: krogerSearchTerms(name), orderedCount: 1
  });
}

function openKrogerProductPicker(itemName, onResolved){
  var body = el('div');
  var status = el('p', {style:'color:var(--ink-soft);font-size:14px;'}, ['Searching for "' + itemName + '"…']);
  body.appendChild(status);
  var listWrap = el('div');
  body.appendChild(listWrap);
  openSheet('Find "' + itemName + '"', body, true);

  searchKrogerProducts(itemName).then(function(results){
    status.remove();
    if (!results.length){
      listWrap.appendChild(el('p', {style:'color:var(--ink-soft);font-size:14px;'}, ["No matches found — try adding this one in the Kroger app directly."]));
      return;
    }
    var list = el('ul', {class:'picker-list'});
    results.forEach(function(p){
      list.appendChild(el('li', {}, [
        el('button', {class:'picker-item', onclick: function(){
          saveKrogerMatch(p.upc, p.name);
          closeSheet();
          toast('Saved — added to your cart too');
          var kroger = Store.get().kroger;
          ensureKrogerToken().then(function(token){
            if (!token) return;
            fetch(kroger.workerUrl.replace(/\/$/,'') + '/cart/add', {
              method: 'POST', headers: {'Content-Type':'application/json'},
              body: JSON.stringify({ access_token: token, items: [{ upc: p.upc, quantity: 1, modality: 'DELIVERY' }] })
            }).catch(function(){});
          });
          if (onResolved) onResolved();
        }}, [p.name])
      ]));
    });
    listWrap.appendChild(list);
  });
}

function findKrogerMatch(rawName){
  var norm = normalize(rawName).replace(/\([^)]*\)/g, '');
  var words = norm.split(' ').filter(function(w){ return w.length > 2 && KROGER_MATCH_STOPWORDS.indexOf(w) === -1; });
  if (!words.length) return null;
  var best = null, bestScore = 0;
  Store.list('krogerMatches').forEach(function(m){
    var terms = m.searchTerms || [];
    var score = 0;
    words.forEach(function(w){ if (terms.indexOf(w) !== -1) score++; });
    if (score > bestScore){ bestScore = score; best = m; }
  });
  return bestScore >= 1 ? best : null;
}

function sendGroceryListToKroger(){
  var kroger = Store.get().kroger;
  if (!kroger.workerUrl){ toast('Add your Worker URL in Settings first'); return; }
  toast('Sending to Kroger…');
  ensureKrogerToken().then(function(token){
    if (!token){ toast('Not connected — check Settings > Kroger account'); return; }

    var byCat = buildCombinedGroceryList();
    var all = [];
    Object.keys(byCat).forEach(function(cat){ all = all.concat(byCat[cat]); });
    var unchecked = all.filter(function(i){ return !i.checked; });

    if (!unchecked.length){ toast('Nothing on the list to send'); return; }

    var matched = [], unmatched = [];
    unchecked.forEach(function(item){
      var m = findKrogerMatch(item.name);
      if (m) matched.push({ upc: m.upc, quantity: 1, displayName: item.name, matchedName: m.name });
      else unmatched.push(item.name);
    });

    if (!matched.length){
      showCartResultSheet([], unmatched);
      return;
    }

    fetch(kroger.workerUrl.replace(/\/$/,'') + '/cart/add', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        access_token: token,
        items: matched.map(function(m){ return { upc: m.upc, quantity: m.quantity, modality: 'DELIVERY' }; })
      })
    }).then(function(r){
      return r.text().then(function(t){ return { ok: r.ok, status: r.status, text: t }; });
    }).then(function(res){
      if (res.ok){
        showCartResultSheet(matched, unmatched);
      } else {
        console.error('Kroger cart add failed', res.status, res.text);
        toast('Kroger rejected the request (see console) — matching data may need a tweak');
      }
    }).catch(function(){
      toast("Couldn't reach the Worker — check the URL in Settings");
    });
  });
}

function showCartResultSheet(matched, unmatched){
  var body = el('div');
  if (matched.length){
    body.appendChild(el('p', {style:'font-size:15px;line-height:1.5;'}, [
      matched.length + ' item' + (matched.length===1?'':'s') + ' added to your Kroger cart — one of each, adjust quantities in the Kroger app if a recipe needs more.'
    ]));
  } else {
    body.appendChild(el('p', {style:'font-size:15px;line-height:1.5;color:var(--ink-soft);'}, ["Nothing on the list matched a saved Kroger product yet."]));
  }
  var unmatchedWrap = el('div');
  body.appendChild(unmatchedWrap);
  function renderUnmatched(){
    unmatchedWrap.innerHTML = '';
    if (!unmatched.length) return;
    unmatchedWrap.appendChild(el('div', {class:'section-title'}, ['Still need to add (' + unmatched.length + ')']));
    var list = el('ul', {class:'picker-list'});
    unmatched.forEach(function(name, idx){
      list.appendChild(el('li', {}, [
        el('div', {class:'picker-item', style:'cursor:default;'}, [
          el('span', {}, [name]),
          el('button', {class:'chip', onclick: function(){
            openKrogerProductPicker(name, function(){
              unmatched.splice(idx, 1);
              renderUnmatched();
            });
          }}, ['Find it'])
        ])
      ]));
    });
    unmatchedWrap.appendChild(list);
  }
  renderUnmatched();
  if (matched.length){
    body.appendChild(el('a', {href:'https://www.kroger.com/cart', target:'_blank', class:'btn btn-primary btn-block', style:'margin-top:16px;text-decoration:none;text-align:center;'}, ['Open Kroger to finish']));
  }
  openSheet('Sent to Kroger', body, true);
}

function readAndResizePhoto(file, maxDim, quality, callback){
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = function(){ toast("Couldn't read that photo"); };
    img.src = e.target.result;
  };
  reader.onerror = function(){ toast("Couldn't read that photo"); };
  reader.readAsDataURL(file);
}
function toast(msg){
  var t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

/* ---------------------------------------------------------
   Store — single access point for all persistence.
   Swapping localStorage for Firebase later only touches this block.
--------------------------------------------------------- */
var Store = (function(){
  var data = null;

  function blank(){
    return {
      schemaVersion: SCHEMA_VERSION,
      recipes: {},
      planEntries: {},
      groceryItems: {},
      staples: {},
      weekChecks: {}, // { weekStartISO: { normKey: true } }
      krogerMatches: {}, // { upc: {upc, name, category, searchTerms, orderedCount, orderDates} } — seeded from receipts, editable in Settings
      kroger: { workerUrl: '', accessToken: null, refreshToken: null, expiresAt: 0, locationId: '02600568' }, // Westhaven Town Village, 411 Whitman St
      settings: {
        householdSize: 4,
        categoryOrder: CATEGORIES.slice(),
        shareMethod: 'auto',
        weekViewMode: 'day'
      }
    };
  }

  function migrate(d){
    if (!d.schemaVersion) d.schemaVersion = 1;
    // Future migrations go here, keyed by d.schemaVersion, then bump.
    if (!d.weekChecks) d.weekChecks = {};
    if (!d.settings) d.settings = blank().settings;
    if (!d.settings.categoryOrder) d.settings.categoryOrder = CATEGORIES.slice();
    if (!d.settings.weekViewMode) d.settings.weekViewMode = 'day';
    if (!d.krogerMatches) d.krogerMatches = {};
    if (!d.kroger) d.kroger = { workerUrl: '', accessToken: null, refreshToken: null, expiresAt: 0, locationId: '02600568' };
    return d;
  }

  function load(){
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      data = raw ? migrate(JSON.parse(raw)) : blank();
    } catch(e){
      console.error('Store load failed', e);
      data = blank();
    }
    return data;
  }

  function persist(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch(e){
      console.error('Store save failed', e);
      toast("Couldn't save — storage may be full");
    }
  }

  function get(){ return data; }

  function put(collection, record){
    var now = Date.now();
    if (!record.id) record.id = uuid();
    record.updatedAt = now;
    if (record.deleted === undefined) record.deleted = false;
    data[collection][record.id] = record;
    persist();
    return record;
  }

  function softDelete(collection, id){
    var rec = data[collection][id];
    if (rec){ rec.deleted = true; rec.updatedAt = Date.now(); persist(); }
  }

  function list(collection){
    return Object.values(data[collection]).filter(function(r){ return !r.deleted; });
  }

  function saveSettings(patch){
    Object.assign(data.settings, patch);
    persist();
  }

  return { load: load, get: get, put: put, softDelete: softDelete, list: list, saveSettings: saveSettings, persist: persist, blank: blank };
})();

/* ---------------------------------------------------------
   Seed data — Shannon's captured recipe names.
   Ingredients/steps intentionally empty; needsDetails flags them.
--------------------------------------------------------- */
/* ---------------------------------------------------------
   Kroger product matches — seeded once from receipt exports.
   Lets the (future) cart-push feature resolve an ingredient

category":"Meat & Seafood"},{"qty":2,"unit":"tbsp","item":"fresh lime juice","category":"Produce"},{"qty":2,"unit":"","item":"red bell peppers, thinly sliced","category":"Produce"},{"qty":1,"unit":"","item":"red onion, thinly sliced","category":"Produce"},{"qty":1,"unit":"tsp","item":"chili powder","category":"Condiments & Spices"},{"qty":0.5,"unit":"tsp","item":"ground cumin","category":"Condiments & Spices"},{"qty":0.25,"unit":"tsp","item":"Tabasco","category":"Condiments & Spices"},{"qty":10,"unit":"","item":"small (6-inch) flour tortillas","category":"Bakery"},{"qty":2,"unit":"","item":"avocados","category":"Produce"},{"qty":8,"unit":"oz","item":"sour cream","category":"Dairy & Eggs"},{"qty":null,"unit":"","item":"shredded cheese","category":"Dairy & Eggs"},{"qty":null,"unit":"","item":"shredded lettuce","category":"Produce"},{"qty":null,"unit":"","item":"salsa","category":"Condiments & Spices"}],"steps":["Prep chicken: Pat chicken dry and slice into 1/2-inch-wide strips. Season with salt and pepper.","Cook chicken: Heat 1 tbsp oil in a large skillet over medium-high heat. Add chicken and cook until cooked through, about 4 minutes. Transfer to a bowl and toss with the lime juice.","Cook vegetables: Add remaining 1 tbsp oil to the skillet. Add bell peppers, onion, chili powder, cumin, 1/2 tsp salt, and 2 tbsp water. Cook, stirring occasionally, until onion is softened, about 5 minutes. Add up to 2 more tbsp water if the pan gets too dry.","Combine: Return chicken and any juices to the skillet. Stir in 1/4 tsp Tabasco. Season with additional salt and pepper as needed.","Warm tortillas: Stack tortillas on a microwave-safe plate, cover, and microwave for 40-60 seconds, until warm.","Serve: Fill warm tortillas with chicken and pepper mixture. Add your favorite toppings and enjoy!"],"notes":"Ingredient list didn't give quantities for cheese, lettuce, or salsa \u2014 added with no amount, adjust to taste.","servingsBase":null},{"name":"Paleo Beef Enchiladas","ingredients":[{"qty":1,"unit":"tbsp","item":"olive oil","category":"Condiments & Spices"},{"qty":0.5,"unit":"","item":"onion, diced","category":"Produce"},{"qty":1,"unit":"lb","item":"ground beef","category":"Meat & Seafood"},{"qty":4.5,"unit":"oz","item":"can diced green chilies","category":"Canned & Jarred"},{"qty":0.5,"unit":"tsp","item":"sea salt","category":"Condiments & Spices"},{"qty":6,"unit":"","item":"Siete grain-free tortillas (6-8)","category":"Bakery"},{"qty":18,"unit":"oz","item":"tomato sauce (for enchilada sauce)","category":"Canned & Jarred"},{"qty":0.5,"unit":"cup","item":"chicken broth (for enchilada sauce)","category":"Canned & Jarred"},{"qty":3,"unit":"tbsp","item":"chili powder (for enchilada sauce)","category":"Condiments & Spices"},{"qty":1,"unit":"tbsp","item":"garlic powder (for enchilada sauce)","category":"Condiments & Spices"},{"qty":1,"unit":"tbsp","item":"onion powder (for enchilada sauce)","category":"Condiments & Spices"},{"qty":1,"unit":"tsp","item":"sea salt (for enchilada sauce)","category":"Condiments & Spices"},{"qty":1,"unit":"tsp","item":"cumin (for enchilada sauce)","category":"Condiments & Spices"},{"qty":1,"unit":"tsp","item":"oregano (for enchilada sauce)","category":"Condiments & Spices"},{"qty":1,"unit":"tsp","item":"coconut aminos (for enchilada sauce)","category":"Condiments & Spices"},{"qty":0.25,"unit":"tsp","item":"cayenne pepper (for enchilada sauce)","category":"Condiments & Spices"}],"steps":["Preheat oven to 400\u00b0F.","Combine all sauce ingredients in a small saucepan and bring to a boil over medium heat. Reduce heat to low and let it simmer while you make the enchiladas.","Heat olive oil over medium heat in a large saute pan. Add onions, green chilies, and beef and saute until browned and cooked through.","Add 1/4 cup of the sauce plus the 1/2 tsp salt and stir to combine.","Spoon 1/2 cup of the enchilada sauce into the bottom of a 9x13 baking dish.","For the tortillas: heat each one individually for 10-15 seconds on a hot griddle or pan, or microwave for 10-15 seconds on a plate.","Once heated, fill each tortilla with a bit of the meat mixture, fold the sides over, and flip it so the seam is tucked underneath. Place on top of the enchilada sauce in the baking dish.","Repeat until all tortillas have been filled and placed in the dish.","Top with remaining sauce and bake for 20 minutes until bubbling.","Top with dairy-free sour cream, cilantro, and avocado. Enjoy!"],"notes":"Source: maryswholelife.com. Recipe listed a range of 6-8 tortillas (1 pack = 8) \u2014 set to 6, adjust as needed.","servingsBase":null},{"name":"Raspberry Crumble Bars","servingsBase":12,"ingredients":[{"qty":2,"unit":"","item":"sticks (1/2 lb) unsalted butter, room temperature","category":"Dairy & Eggs"},{"qty":0.75,"unit":"cup","item":"sugar","category":"Baking"},{"qty":1,"unit":"tsp","item":"pure vanilla extract","category":"Baking"},{"qty":2.33,"unit":"cup","item":"all-purpose flour","category":"Baking"},{"qty":0.5,"unit":"tsp","item":"kosher salt","category":"Condiments & Spices"},{"qty":11,"unit":"oz","item":"good raspberry jam (10-12 oz), such as Hero","category":"Condiments & Spices"},{"qty":0.67,"unit":"cup","item":"good granola without dried fruit","category":"Snacks"},{"qty":0.25,"unit":"cup","item":"sliced almonds","category":"Baking"},{"qty":null,"unit":"","item":"confectioners' sugar, for sprinkling","category":"Baking"}],"steps":["Preheat the oven to 350\u00b0F.","Place the butter and sugar in the bowl of an electric mixer fitted with the paddle attachment and mix on medium speed just until combined.","With the mixer on low, add the vanilla.","Sift the flour and salt together and, with the mixer on low, slowly add to the butter mixture, mixing until it almost comes together in a ball.","Turn the dough out on a board. Lightly pat two-thirds of the dough evenly on the bottom of a 9-inch square baking pan and about 1/4 inch up the sides.","Spread with the jam, leaving a 1/4-inch border.","Mix the granola into the remaining dough with your hands. Break the dough into small bits and distribute it on top of the jam, covering most of the surface. Sprinkle the almonds on top.","Bake the bars for 45 minutes, until lightly browned.","Cool completely and cut into 9 or 12 bars. Sprinkle lightly with confectioners' sugar."],"notes":"Source: Barefoot Contessa Foolproof, Clarkson Potter/Publishers (2012). Yield is bars, not people \u2014 set servings to 12 to match \"cut into 9 or 12 bars\"; adjust if you usually cut 9."},{"name":"Kayley's Inchalladas","servingsBase":5,"ingredients":[{"qty":1.5,"unit":"lb","item":"boneless skinless chicken breasts, to shred","category":"Meat & Seafood"},{"qty":2,"unit":"can","item":"mild green enchilada sauce","category":"Canned & Jarred"},{"qty":8,"unit":"oz","item":"sour cream","category":"Dairy & Eggs"},{"qty":1,"unit":"pkg","item":"Mexican blend cheese (1 bag)","category":"Dairy & Eggs"},{"qty":1,"unit":"pkg","item":"frozen corn (1 bag)","category":"Frozen"},{"qty":10,"unit":"","item":"small tortillas (1 bag)","category":"Bakery"}],"steps":["Preheat oven to 400\u00b0F.","Mix 2 cans of green enchilada sauce with the 8 oz sour cream in a separate bowl.","Spread enough enchilada sauce on the bottom of a baking dish to lightly cover it.","Put chicken breasts in cold water and bring to a boil; simmer for 15 minutes. Check with a thermometer to make sure it's fully cooked. Shred with forks or fingers once cooked.","Add 2-3 spoonfuls of sauce to the shredded chicken in a bowl.","Grab your tortillas, add some chicken, roll it up, and place seam side down in the dish.","Repeat until you use all the chicken and tortillas.","Add sauce on top and sprinkle with Mexican blend cheese \u2014 measured with your heart.","Bake for about 10 minutes until cheese melts. Top with cilantro and serve with corn or Spanish rice!"],"notes":""},{"name":"Fresh Strawberry Cake","ingredients":[{"qty":1.5,"unit":"cup","item":"unsalted butter (3 sticks), softened \u2014 cake","category":"Dairy & Eggs"},{"qty":2.25,"unit":"cup","item":"sugar","category":"Baking"},{"qty":2,"unit":"tbsp","item":"vegetable oil","category":"Condiments & Spices"},{"qty":4,"unit":"","item":"egg whites, room temperature","category":"Dairy & Eggs"},{"qty":1,"unit":"tsp","item":"vanilla extract \u2014 cake","category":"Baking"},{"qty":3,"unit":"cup","item":"all-purpose flour","category":"Baking"},{"qty":2.75,"unit":"tsp","item":"baking powder","category":"Baking"},{"qty":0.25,"unit":"tsp","item":"baking soda","category":"Baking"},{"qty":0.25,"unit":"tsp","item":"salt","category":"Condiments & Spices"},{"qty":1,"unit":"cup","item":"whole milk, room temperature","category":"Dairy & Eggs"},{"qty":0.5,"unit":"cup","item":"strawberry puree (fresh strawberries)","category":"Produce"},{"qty":null,"unit":"","item":"red food coloring, if desired","category":"Baking"},{"qty":2,"unit":"","item":"sticks unsalted butter, softened \u2014 frosting","category":"Dairy & Eggs"},{"qty":8,"unit":"oz","item":"cream cheese, softened","category":"Dairy & Eggs"},{"qty":2,"unit":"lb","item":"confectioners' sugar","category":"Baking"},{"qty":1,"unit":"tsp","item":"vanilla extract \u2014 frosting","category":"Baking"},{"qty":0.375,"unit":"cup","item":"ground freeze-dried strawberries (1/4-1/2 cup)","category":"Snacks"}],"steps":["Preheat oven to 350\u00b0F. Grease and flour three 8\" cake pans (shortening + flour dust, or non-stick baking spray). Set aside.","In a mixing bowl fitted with a paddle attachment, cream butter, sugar, and oil together on medium-high speed for 3 minutes, until super light and fluffy. Scrape down the sides.","Add egg whites and vanilla and beat for 1 minute \u2014 no more, or the egg whites will change the batter's consistency.","In a medium bowl, whisk together the flour, baking powder, baking soda, and salt.","In a blender or food processor, puree fresh strawberries until smooth, until you have 1/2 cup. Add to a liquid measuring cup with the milk.","Add about one third of the flour to the butter mixture and beat until incorporated, then scrape down the sides.","Add about half of the milk/strawberry puree to the batter and beat until incorporated, then scrape down the sides.","Continue alternating flour and milk, ending with the flour mixture. Do not overmix. For a pinker color, add a drop or two of red food coloring.","Divide the batter into the three greased pans and bake 20-25 minutes, until a toothpick comes out clean.","Cool in pans for 10 minutes, then on a cooling rack until completely cooled.","In a food processor or blender, grind freeze-dried strawberries until you have 1/4-1/2 cup ground.","In a mixing bowl, cream the softened butter and cream cheese on medium-high speed for about 3 minutes, until light and fluffy. Add vanilla extract and mix until combined.","Slowly add the confectioners' sugar and ground freeze-dried strawberries, then beat on medium speed 2-3 minutes until light, fluffy and creamy. Use 1/4 cup strawberries for lighter pink, more for brighter. If too thick, add 1-2 tbsp heavy cream or milk.","Frost the cake and top with strawberries!"],"notes":"Source: elisabethandbutter.com. The frosting uses its own separate butter (2 sticks) and vanilla (1 tsp) \u2014 listed separately above from the cake's 3 sticks butter + 1 tsp vanilla so the two don't get combined by mistake.","servingsBase":null},{"name":"Snickerdoodle Sue's Cookies","ingredients":[{"qty":3,"unit":"tbsp","item":"white sugar (for topping)","category":"Baking"},{"qty":1,"unit":"tbsp","item":"ground cinnamon (for topping)","category":"Condiments & Spices"},{"qty":2.5,"unit":"cup","item":"all-purpose flour","category":"Baking"},{"qty":0.5,"unit":"tsp","item":"baking soda","category":"Baking"},{"qty":0.25,"unit":"tsp","item":"salt","category":"Condiments & Spices"},{"qty":1,"unit":"cup","item":"dark brown sugar, packed","category":"Baking"},{"qty":0.5,"unit":"cup","item":"white sugar","category":"Baking"},{"qty":1,"unit":"cup","item":"salted butter, softened","category":"Dairy & Eggs"},{"qty":2,"unit":"","item":"large eggs","category":"Dairy & Eggs"},{"qty":2,"unit":"tsp","item":"pure vanilla extract","category":"Baking"}],"steps":["Heat oven to 300\u00b0F.","In a small bowl, combine cinnamon and sugar for topping. Set aside.","In a medium bowl, combine flour, soda, and salt. Mix well with a wire whisk and set aside.","In a large bowl, blend sugars with an electric mixer at medium speed. Add the butter and mix to form a grainy paste. Scrape sides of bowl, then add the eggs and vanilla extract. Mix at medium speed until light and fluffy.","Add the flour mixture and blend at low speed just until combined. Do not overmix.","Shape dough into 1-inch balls and roll each ball in the cinnamon sugar topping.","Place onto ungreased cookie sheets 2 inches apart. Bake for 18-20 minutes. Immediately transfer the cookies with a spatula to a cool, flat surface."],"notes":"","servingsBase":null},{"name":"Sue Ruge's Homemade Guacamole","servingsBase":3,"ingredients":[{"qty":6,"unit":"","item":"Haas avocados","category":"Produce"},{"qty":3,"unit":"tbsp","item":"freshly squeezed lemon juice","category":"Produce"},{"qty":8,"unit":"","item":"dashes Tabasco sauce","category":"Condiments & Spices"},{"qty":1,"unit":"tsp","item":"Kosher salt","category":"Condiments & Spices"},{"qty":1,"unit":"tsp","item":"freshly ground black pepper","category":"Condiments & Spices"},{"qty":1,"unit":"","item":"medium tomato, seeded and small diced","category":"Produce"}],"steps":["Cut the avocados in half, remove the pits, and scoop the flesh out into a bowl (hands work fine).","Immediately add the lemon juice, salt, pepper, and Tabasco sauce, and toss well. Use a knife to slice through the avocados in the bowl until they're fine.","Mix the tomatoes in and taste for adding any more salt and pepper."],"notes":""},{"name":"Cozy Wild Rice and Orzo Chicken Soup","ingredients":[{"qty":0.75,"unit":"lb","item":"boneless skinless chicken breasts or thighs","category":"Meat & Seafood"},{"qty":1,"unit":"","item":"yellow onion, chopped","category":"Produce"},{"qty":4,"unit":"clove","item":"garlic, peeled","category":"Produce"},{"qty":1,"unit":"cup","item":"dry wild rice blend","category":"Dry Goods & Pasta"},{"qty":1.5,"unit":"cup","item":"carrots, chopped","category":"Produce"},{"qty":1,"unit":"cup","item":"chopped celery","category":"Produce"},{"qty":1,"unit":"tbsp","item":"poultry seasoning (rounded)","category":"Condiments & Spices"},{"qty":0.5,"unit":"tsp","item":"paprika","category":"Condiments & Spices"},{"qty":null,"unit":"","item":"kosher salt and black pepper, to taste","category":"Condiments & Spices"},{"qty":6,"unit":"cup","item":"low-sodium chicken broth","category":"Canned & Jarred"},{"qty":2,"unit":"cup","item":"fresh baby spinach or kale","category":"Produce"},{"qty":0.75,"unit":"cup","item":"dry orzo pasta","category":"Dry Goods & Pasta"},{"qty":0.25,"unit":"cup","item":"chopped fresh parsley","category":"Produce"},{"qty":1,"unit":"cup","item":"heavy cream or whole milk","category":"Dairy & Eggs"},{"qty":6,"unit":"tbsp","item":"salted butter","category":"Dairy & Eggs"},{"qty":8,"unit":"","item":"fresh sage leaves","category":"Produce"},{"qty":null,"unit":"","item":"shaved parmesan, to taste","category":"Dairy & Eggs"}],"steps":["In the bowl of your Instant Pot, combine the chicken, onion, garlic, wild rice, carrots, celery, poultry seasoning, paprika, salt, and pepper. Pour over the broth and add 1/2 cup water.","Cover and cook on high pressure for 12 minutes. Quick release the steam.","Switch the Instant Pot to saut\u00e9. Remove the garlic cloves and set aside. Shred the chicken with 2 forks. Stir in the spinach and orzo. Cover and cook 6-8 minutes, until the orzo is al dente. Stir in the cream and parsley. Add water if the soup needs more liquid.","Add the butter, garlic, and sage to a skillet over medium heat. Mash the garlic into the butter, letting it brown and some garlic get crispy. Remove from heat.","Ladle the soup into bowls and spoon over the sage butter. Top with parmesan and parsley. Enjoy!"],"notes":"Source: halfbakedharvest.com. This recipe also gives Crockpot and Stove methods \u2014 Instant Pot set as the default steps above. Crockpot: same ingredients in the slow cooker, low 6-7 hrs or high 2-3 hrs, then high heat + shred chicken + spinach/orzo 20-30 min, finish the same way. Stove: saute aromatics in butter, add broth + chicken + rice, simmer 35-45 min until rice is tender, then shred chicken + spinach/orzo 6-8 min, finish the same way. Tip from the recipe: add extra cream for extra creaminess.","servingsBase":null},{"name":"Easy Hawaiian Roll Sandwiches","photo":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCADtAWcDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwDvYbaNAEAwwHJPesy9dkmffIFjHAAPJrVdsHeGGSOAKx7mzSeV3djz1GeM1zKR2cnYzblFjQ/vQxJyAOuPSjdsKEKSAMnI4q21mqyIWA4OMmthLaIx4KqQBwSOprSNW+hm6Rj3ltI4hktkygGcdgapTBYMPKhLk/UCtWFLm081pXG05Cr0GKyZZRK0m4glRkjqc0pTbY1TViLzdk6SLzuPAI4BrTRRPC+6UAqQcCodOskvVWZsgKMgdBVwW0dqsjjLFuQMdDRzWWoKGugi2r7GdjnABUDvVeNpZrnc8eAvC59avQy71XGQQOR6VNEFcPIFACc4PGfpWfMaW01IJLkx7VdcBjgN6D0p16SEBiOMjk561O6RyorhflJ4zyM1l3MyAMoclgSAAcAVF9R2KzysrYc4I7k9aYziQAk8jpjvTZnj8sDgt ooking wine. Mix together and pour over the cheese.","Mix the stuffing and butter together (melt the butter in the microwave) and put on top of the soup/sherry mixture.","Bake at 350\u00b0F for 1 hour."],"notes":"The original recipe photo was captioned \"Chicken Supreme\" \u2014 same recipe, worth knowing if that name rings a bell. Chicken quantity was given as a 6-12 range; set to 9 as a middle estimate."},{"name":"Caprese Grilled Chicken","ingredients":[{"qty":4,"unit":"","item":"boneless, skinless chicken breasts","category":"Meat & Seafood"},{"qty":null,"unit":"","item":"extra virgin olive oil","category":"Condiments & Spices"},{"qty":null,"unit":"","item":"balsamic vinegar (for marinade)","category":"Condiments & Spices"},{"qty":null,"unit":"","item":"freshly squeezed lemon juice","category":"Produce"},{"qty":null,"unit":"","item":"Italian seasoning","category":"Condiments & Spices"},{"qty":null,"unit":"","item":"kosher salt","category":"Condiments & Spices"},{"qty":null,"unit":"","item":"freshly ground black pepper","category":"Condiments & Spices"},{"qty":null,"unit":"","item":"pesto (~1 tbsp per chicken breast \u2014 amount not in the saved list)","category":"Condiments & Spices"},{"qty":0.5,"unit":"cup","item":"shredded mozzarella cheese","category":"Dairy & Eggs"},{"qty":2,"unit":"cup","item":"cherry or grape tomatoes","category":"Produce"},{"qty":null,"unit":"","item":"fresh basil leaves","category":"Produce"},{"qty":null,"unit":"","item":"balsamic vinegar (for tomato topping)","category":"Condiments & Spices"},{"qty":null,"unit":"","item":"crushed red pepper flakes, optional","category":"Condiments & Spices"}],"steps":["Marinate the chicken: place the chicken breasts on a cutting board, cover with parchment paper or plastic wrap, and pound with a meat mallet (or the bottom of a heavy skillet) to a uniform 1/2-inch thickness. Pat dry with paper towels.","Place the chicken in a large bowl with the olive oil, balsamic, lemon juice, Italian seasoning, salt, and pepper. Toss to combine and marinate for 15 minutes.","Make the cherry tomato topping: in a medium bowl, combine all the tomato topping ingredients and toss. Set aside while you grill the chicken.","Grill the chicken: heat the grill to medium-high (350-400\u00b0F) and oil the grates (wipe a little oil over them with a wadded, tonged paper towel \u2014 go easy to avoid flare-ups).","Cook the chicken about 4 minutes per side, lid closed, until grill marks appear and it's cooked through.","Reduce heat to medium-low. Spoon about 1 tbsp pesto onto each chicken breast and spread into an even layer, then sprinkle with mozzarella. Cover and cook until the cheese just melts, about 2 minutes.","Remove from the grill, transfer to a platter, and let rest about 4 minutes.","Serve by spooning the cherry tomato mixture across the tops of the chicken."],"notes":"Source: thedefineddish.com. The saved ingredient list is missing pesto even though the method calls for about 1 tbsp per chicken breast \u2014 added it in with no set amount so it doesn't get missed on the grocery list. No hero photo was in this batch of screenshots, so this one's still using the colored placeholder tile.","servingsBase":null,"photo":null},{"name":"Creamy Roasted Butternut Squash Pasta with Sausage and Spinach","photo":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAD6AWcDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5O :"avocado","category":"Produce"},{"qty":1,"unit":"","item":"lemon","category":"Produce"},{"qty":null,"unit":"","item":"fresh dill","category":"Produce"}],"steps":["In a bowl, combine the yogurt, olive oil, cubed chicken, garlic, shallots, paprika, oregano, and a large pinch each of salt and pepper. Marinate 15 minutes at room temperature, or up to overnight in the fridge.","Preheat the oven to 425\u00b0F. Arrange the chicken on a baking sheet. Bake 15 minutes, toss, and bake another 5-10 minutes until cooked through. Switch to broil and broil 1-2 minutes, until the chicken chars on the edges.","Meanwhile, combine the cucumbers, avocado, lemon, dill, salt, and pepper.","Make the tahini: blend all the tahini ingredients with 1/4 cup water until smooth. Add more water to thin if needed. Season to taste with salt.","To assemble: add lettuce to a bowl, top with chicken, cucumber/avocado, feta, and any other toppings. Add a few dollops of tzatziki sauce and drizzle with the tahini."],"notes":"Source: halfbakedharvest.com. \"Fresh dill\" is called for in step 3 but wasn't in the saved ingredient list \u2014 added it in. The \"ginger tahini sauce\" line was saved as one item with a \"?\" (kept as-is, looks like a from-scratch sauce whose parts weren't broken out). No usable photo in this batch \u2014 the screenshot only showed a sliver dominated by the status bar, so this one's still on the placeholder tile.","photo":null},{"name":"Warm Brown Rice & Butternut Squash","servingsBase":6,"ingredients":[{"qty":4,"unit":"cup","item":"butternut squash, 1/2-3/4 inch diced (1.5 lb)","category":"Produce"},{"qty":0.625,"unit":"cup","item":"good olive oil, divided (2 tbsp + 1/2 cup)","category":"Condiments & Spices"},{"qty":2,"unit":"tbsp","item":"pure maple syrup, divided","category":"Condiments & Spices"},{"qty":1.5,"unit":"cup","item":"brown rice, such as Texmati long-grain basmati","category":"Dry Goods & Pasta"},{"qty":3,"unit":"tbsp","item":"freshly squeezed orange juice","category":"Produce"},{"qty":1,"unit":"tbsp","item":"balsamic vinegar","category":"Condiments & Spices"},{"qty":1,"unit":"tbsp","item":"good white wine vinegar","category":"Condiments & Spices"},{"qty":2,"unit":"tsp","item":"Dijon mustard, such as Grey Poupon","category":"Condiments & Spices"},{"qty":4,"unit":"","item":"scallions, thinly cut diagonally","category":"Produce"},{"qty":0.67,"unit":"cup","item":"dried cranberries","category":"Snacks"},{"qty":0.5,"unit":"cup","item":"salted Marcona almonds","category":"Snacks"},{"qty":null,"unit":"","item":"kosher salt and freshly ground black pepper","category":"Condiments & Spices"}],"steps":["Preheat the oven to 400\u00b0F.","Place the butternut squash on a sheet pan with 2 tbsp olive oil, 1 tbsp maple syrup, 2 tsp salt, and 1 tsp pepper. Toss, spread in a single layer, and roast 30 minutes, tossing twice, until tender and starting to brown.","Meanwhile, in a large saucepan, combine the rice, 3 1/4 cups water, and 1 1/2 tsp salt. Bring to a boil, stir, lower the heat, cover, and simmer 25 minutes.","Turn off the heat and let the rice sit, lid on, for 10 minutes (this differs from the package directions). Drain any liquid left in the pot.","For the vinaigrette: whisk together the remaining 1 tbsp maple syrup, the orange juice, balsamic vinegar, white wine vinegar, mustard, 2 tsp salt, and 1 tsp pepper in a glass measuring cup. Slowly whisk in the remaining 1/2 cup olive oil.","Pour the warm rice into a large serving bowl. Add most of the vinaigrette and combine.","Add the squash, scallions, dried cranberries, and almonds and toss well \u2014 the dish may want the extra vinaigrette as it sits.","Taste for seasoning and serve warm or at room temperature."],"notes":"Source: Barefoot Contessa, \"Cook Like a Pro\" (Clarkson Potter, 2018). Olive oil and salt/pepper appeared in the instructions but were missing from the saved ingredient list \u2014 added them in. No photo available in this batch's screenshots.","photo":null},{"name": y":"Dry Goods & Pasta"}],"steps":["Marinate the salmon earlier in the day with half Italian dressing and half soy sauce.","Start water for pasta. Heat the oven to 375\u00b0F. Make the veggies and pasta!"],"notes":"","servingsBase":null},{"name":"White Chicken Chili \u2014 All Types Of Bowls","servingsBase":4,"ingredients":[{"qty":1,"unit":"tbsp","item":"olive oil","category":"Condiments & Spices"},{"qty":1,"unit":"","item":"sweet onion, diced","category":"Produce"},{"qty":0.25,"unit":"cup","item":"green onion, white parts, chopped","category":"Produce"},{"qty":1,"unit":"","item":"yellow bell pepper, diced","category":"Produce"},{"qty":1,"unit":"","item":"jalapeno, diced","category":"Produce"},{"qty":15,"unit":"oz","item":"can sweet yellow corn, drained","category":"Canned & Jarred"},{"qty":15,"unit":"oz","item":"can white corn, drained","category":"Canned & Jarred"},{"qty":15,"unit":"oz","item":"can cannellini beans, drained","category":"Canned & Jarred"},{"qty":15,"unit":"oz","item":"can white northern beans, drained","category":"Canned & Jarred"},{"qty":15,"unit":"oz","item":"can pinto beans, drained","category":"Canned & Jarred"},{"qty":8,"unit":"oz","item":"mild green chiles","category":"Canned & Jarred"},{"qty":2,"unit":"","item":"large chicken breasts, or 3 cups shredded rotisserie chicken","category":"Meat & Seafood"},{"qty":3,"unit":"cup","item":"chicken broth","category":"Canned & Jarred"},{"qty":1,"unit":"tsp","item":"cumin","category":"Condiments & Spices"},{"qty":1,"unit":"tsp","item":"paprika","category":"Condiments & Spices"},{"qty":0.25,"unit":"tsp","item":"chili powder","category":"Condiments & Spices"},{"qty":1,"unit":"tsp","item":"garlic powder","category":"Condiments & Spices"},{"qty":1,"unit":"tsp","item":"onion powder","category":"Condiments & Spices"},{"qty":0.5,"unit":"tsp","item":"black pepper","category":"Condiments & Spices"},{"qty":1,"unit":"tsp","item":"salt","category":"Condiments & Spices"},{"qty":1,"unit":"cup","item":"plain nonfat Greek yogurt","category":"Dairy & Eggs"},{"qty":0.5,"unit":"","item":"lime, juiced","category":"Produce"},{"qty":null,"unit":"","item":"toppings: green onions, cilantro, jalapenos, Greek yogurt or sour cream","category":"Produce"}],"steps":["In a soup pot, add the olive oil and saut\u00e9 the onion and green onions until they soften.","Add the jalapeno and yellow bell pepper. After a few minutes, add the salt, pepper, garlic powder, onion powder, cumin, chili powder, and paprika. Cook a few more minutes.","Add all the cans \u2014 the beans, the corn, and the chiles. Cook a few more minutes.","Add the chicken broth. Once it simmers, add the chicken breast if making shredded chicken from scratch. Cover and cook 15 minutes.","Remove the chicken once cooked and shred it (or add already-shredded chicken back in). Simmer another 15 minutes, covered.","Mix the Greek yogurt and lime juice into the chili and cook 5 more minutes.","Serve, or store in the fridge up to 5 days. Freezes well too."],"notes":"Source: alltypesofbowls.com. No photo available in this batch's screenshots.","photo":null},{"name":"Creamy White Bean Lemon Pesto Orzo Soup","servingsBase":4,"ingredients":[{"qty":1,"unit":"","item":"shallot","category":"Produce"},{"qty":2,"unit":"tbsp","item":"salted butter","category":"Dairy & Eggs"},{"qty":1,"unit":"pkg","item":"box orzo pasta","category":"Dry Goods & Pasta"},{"qty":6,"unit":"cup","item":"low-sodium bone, chicken, or vegetable broth","category":"Canned & Jarred"},{"qty":1,"unit":"can","item":"white beans","category":"Canned & Jarred"},{"qty":0.5,"unit":"pkg","item":"bag of spinach","category":"Produce"},{"qty":0.5,"unit":"cup","item":"basil pesto","category":"Condiments & Spices"},{"qty":0.5,"unit":"cup","item":"whole milk","category":"Dairy & Eggs"},{"qty":1,"unit":"cup","item":"grated Parmesan cheese","category":"Dairy & Eggs"},{"qty":1,"unit":"","item":"lemon","category":"Produce"},{"qty":1,"unit":"pkg","item":"hamburger meat (optional protein for orzo \u2014 or do salmon!)","category":"Meat & Seafood"},{"qty":null,"unit":"","item":"olive oil","category":"Condiments & Spices"},{"qty":null,"unit":"","item":"garlic","category":"Produce"},{"qty":null,"unit":"","item":"chili flakes","category":"Condiments & Spices"},{"qty":null,"unit":"","item":"kale (alternative/addition to spinach)","category":"Produce"},{"qty":null,"unit":"","item":"parmesan rind, optional","category":"Dairy & Eggs"}],"steps":["Heat the olive oil in a large Dutch oven over medium-high heat. Add the shallot, garlic, and chili flakes and cook until fragrant, about 5 minutes.","Drop in the butter, then stir in the orzo. Cook until golden, 1-3 minutes.","Pour in the broth and bring to a boil over high heat. Season with salt and pepper. Stir in the beans and kale, season again. If you have one, add a parmesan rind. Simmer 8-10 minutes until the orzo is al dente, stirring often \u2014 it should get very creamy.","Stir in the pesto, milk, parmesan, and lemon. Cook a few more minutes until warmed through.","Divide among bowls with extra parmesan and black pepper. Fresh dill, parsley, or basil are good added on top too."],"notes":"Source: halfbakedharvest.com. The method calls for olive oil, garlic, chili flakes, kale, and a parmesan rind that weren't in the saved ingredient list \u2014 added them in with no set amounts. No usable photo in this batch \u2014 the screenshot only showed a thin sliver dominated by the status bar.","photo":null},{"name":"Creamy Tortellini Soup","photo":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAFjAWcDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKz ry":"Condiments & Spices"},{"qty":1,"unit":"tsp","item":"fresh chopped basil","category":"Produce"},{"qty":1,"unit":"lb","item":"mild Italian sausage","category":"Meat & Seafood"},{"qty":1,"unit":"tbsp","item":"smoked paprika","category":"Condiments & Spices"},{"qty":1,"unit":"pkg","item":"bag of carrots, cut up","category":"Produce"},{"qty":null,"unit":"","item":"grated parmesan, for topping","category":"Dairy & Eggs"}],"steps":["Cook the Italian sausage until done in a separate pan. Set aside to add in at the end.","In a large pot or Dutch oven, saut\u00e9 the diced onion, carrots, and sun-dried tomatoes in oil from the sun-dried tomato jar over medium-high heat until the onions soften, about 4 minutes. Add the minced garlic and cook 1 minute, until fragrant.","Add the Italian seasoning, cayenne, and pepper. Stir to combine.","Pour in the vegetable broth to deglaze, scraping the brown bits from the bottom of the pot with a wooden spoon. Add the heavy cream and bring to a gentle simmer.","Add the spinach and tortellini and simmer 3-5 minutes. Taste and adjust seasoning with salt and pepper. Add the smoked paprika if you want to.","Divide into serving bowls and top with grated parmesan, red pepper flakes, and basil. Enjoy!"],"notes":"Source: eatwell101.com. \"Grated parmesan\" is called for as a topping in the last step but wasn't in the saved ingredient list \u2014 added it in."},{"name":"Sloppy Joes with a Veggie","photo":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAEbAWcDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QA ":"","item":"diced butternut squash","category":"Produce"},{"qty":26,"unit":"oz","item":"canned or boxed chopped tomatoes (Pomi)","category":"Canned & Jarred"},{"qty":2,"unit":"pkg","item":"boxes of bone broth or chicken stock","category":"Canned & Jarred"},{"qty":15,"unit":"oz","item":"can cannellini beans","category":"Canned & Jarred"},{"qty":1,"unit":"pkg","item":"bag of spinach leaves","category":"Produce"},{"qty":null,"unit":"","item":"small dry white wine (Chardonnay)","category":"Beverages"},{"qty":null,"unit":"","item":"block of Parmesan cheese, for topping","category":"Dairy & Eggs"},{"qty":1,"unit":"pkg","item":"box of small pasta, such as tubetti","category":"Dry Goods & Pasta"},{"qty":1,"unit":"","item":"loaf of bread from the bakery, for serving","category":"Bakery"},{"qty":2,"unit":"tbsp","item":"olive oil","category":"Condiments & Spices"},{"qty":4,"unit":"clove","item":"garlic","category":"Produce"},{"qty":2,"unit":"tsp","item":"fresh thyme leaves","category":"Produce"},{"qty":1,"unit":"","item":"bay leaf","category":"Condiments & Spices"},{"qty":null,"unit":"","item":"kosher salt and black pepper","category":"Condiments & Spices"},{"qty":2,"unit":"tbsp","item":"store-bought pesto","category":"Condiments & Spices"}],"steps":["Heat 2 tbsp olive oil over medium heat in a large, heavy pot or Dutch oven. Add the bacon and cook over medium-low heat 6-8 minutes, stirring occasionally, until lightly browned.","Add the onions, carrots, celery, squash, garlic, and thyme. Cook over medium heat, stirring occasionally, 8-10 minutes, until the vegetables begin to soften.","Add the tomatoes, 6 cups of the chicken stock, the bay leaf, 1 tbsp salt, and 1 1/2 tsp pepper. Bring to a boil, then lower the heat and simmer uncovered for 30 minutes, until the vegetables are tender.","Discard the bay leaf. Add the beans and cooked pasta and heat through. If the soup gets too thick, add more chicken stock.","Just before serving, reheat the soup, add the spinach, and toss with two big spoons like tossing a salad. Cook just until the leaves wilt.","Stir in the white wine and pesto. Taste and add another teaspoon or two of salt if needed, depending on how salty the stock was.","Serve in large shallow bowls with a bruschetta on top. Sprinkle with Parmesan, drizzle with olive oil, and serve hot."],"notes":"Source: Ina Garten / barefootcontessa.com. The saved ingredient list looks like your own simplified shopping version (bacon standing in for the original's pancetta, \"bag of carrots\" instead of precise cups) \u2014 kept as-is. The full method calls for a few things missing from that list: olive oil, garlic, fresh thyme, a bay leaf, salt/pepper, and 2 tbsp pesto stirred in near the end \u2014 added those in."}];

function applyRecipePhotoOnlyPatches(){
  var recipes = Store.list('recipes');
  RECIPE_PHOTO_ONLY_PATCHES.forEach(function(patch){
    var match = recipes.find(function(r){ return normalize(r.name) === normalize(patch.name); });
    if (!match || match.photo || !patch.photo) return;
    match.photo = patch.photo;
    Store.put('recipes', match);
  });
}

function applyRecipeDetailPatches(){
  var recipes = Store.list('recipes');
  RECIPE_DETAIL_PATCHES.forEach(function(patch){
    var match = recipes.find(function(r){ return normalize(r.name) === normalize(patch.name); });
    if (!match) return;
    var isPristineStub = match.needsDetails && (match.ingredients||[]).length === 0 && (match.steps||[]).length === 0;
    if (!isPristineStub) return;
    match.ingredients = patch.ingredients;
    match.steps = patch.steps;
    if (patch.servingsBase) match.servingsBase = patch.servingsBase;
    if (patch.notes) match.notes = patch.notes;
    if (patch.photo && !match.photo) match.photo = patch.photo;
    match.needsDetails = false;
    Store.put('recipes', match);
  });
}
